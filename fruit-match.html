<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>一划果园 · 五十关丰收之旅</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:#5a4a5e;
    background:
      radial-gradient(900px 600px at 12% -10%,#ffe7ee 0%,transparent 60%),
      radial-gradient(900px 700px at 110% 110%,#e4f0ff 0%,transparent 55%),
      #fbf7f2;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  .app{
    position:relative;display:flex;flex-direction:column;
    width:min(100vw,440px);height:100dvh;max-height:880px;
    background:linear-gradient(180deg,#fffdf9,#fdf8ff 60%,#f7f9ff);
    box-shadow:0 24px 70px rgba(120,95,150,.18);
    overflow:hidden;
  }
  @media (min-width:480px){
    .app{border-radius:30px;height:min(860px,94dvh);outline:1px solid #f2eaf8}
  }

  /* ---------- HUD ---------- */
  .hud{flex:0 0 auto;padding:10px 14px 8px;display:flex;flex-direction:column;gap:8px}
  .hud-top{display:flex;align-items:center;justify-content:space-between}
  .lvchip{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b7c9b;font-weight:600;min-width:0}
  .lvchip span{
    background:linear-gradient(135deg,var(--ac1),var(--ac2));
    color:#fff;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:900;letter-spacing:1px;
    flex:0 0 auto;box-shadow:0 4px 10px -2px rgba(255,140,100,.45);
  }
  .lvchip b{color:#5c4b6d;font-size:14.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-btns{display:flex;gap:8px;flex:0 0 auto}
  .icon-btn{
    width:34px;height:34px;border-radius:12px;border:1px solid #efe6f8;background:#fff;color:#8b7c9b;
    font-size:13px;display:grid;place-items:center;cursor:pointer;padding:0;
    box-shadow:0 3px 8px -3px rgba(140,110,170,.25);
    transition:transform .12s,background .15s;
  }
  .icon-btn:hover{background:#faf5ff;transform:translateY(-1px)}
  .icon-btn:active{transform:scale(.92)}
  .hud-mid{display:flex;align-items:center;gap:10px}
  .orders{flex:1;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .ochip{
    display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #f1e6f2;
    border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:800;color:#8b7c9b;
    box-shadow:0 2px 6px -2px rgba(140,110,170,.18);
    transition:transform .15s,background .2s,color .2s,border-color .2s;
    white-space:nowrap;
  }
  .ochip b{font-variant-numeric:tabular-nums;color:#5c4b6d}
  .ochip.done{background:linear-gradient(135deg,#e9f9ef,#d9f4e3);border-color:#b9e7c9;color:#3e9e62}
  .ochip.done b{color:#2f8a55}
  .ochip.bump{animation:bump .3s cubic-bezier(.2,1.8,.4,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .movesbox{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#fff;border:1px solid #f1e6f2;border-radius:14px;padding:3px 13px;
    box-shadow:0 2px 8px -3px rgba(140,110,170,.2);min-width:62px;
  }
  .movesbox em{font-style:normal;font-size:9.5px;color:#b3a7c1;font-weight:800;letter-spacing:1px}
  .movesbox b{font-size:23px;font-weight:900;color:#5c4b6d;line-height:1.05;font-variant-numeric:tabular-nums}
  .movesbox.low b{color:#ff5f7a;animation:pulseM .7s infinite alternate}
  @keyframes pulseM{from{transform:scale(1)}to{transform:scale(1.12)}}

  /* ---------- 方形水果小图标（HUD/弹层用） ---------- */
  .fsq{
    display:inline-block;width:14px;height:14px;border-radius:4.5px;flex:0 0 auto;
    background:linear-gradient(180deg,var(--c1),var(--c2));
    box-shadow:inset 0 0 0 1.5px var(--bd),inset 0 -2px 0 rgba(0,0,0,.08),0 1px 3px rgba(140,100,90,.35);
  }
  .fsq{position:relative;overflow:hidden}
  .fsq.lg{width:22px;height:22px;border-radius:7px}

  /* ---------- 画布 ---------- */
  .stage{position:relative;flex:1;min-height:0;background:linear-gradient(180deg,#fffdf6,#fbf7e8,#eaf4e2)}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- 弹层 ---------- */
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(255,252,250,.6);
    backdrop-filter:blur(8px) saturate(1.1);-webkit-backdrop-filter:blur(8px) saturate(1.1);
    opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:9;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{
    width:100%;max-width:342px;background:#fff;
    border-radius:26px;padding:22px 20px;
    box-shadow:0 24px 60px -18px rgba(140,110,170,.42);
    border:1px solid #f4ecfa;text-align:center;
    transform:translateY(10px) scale(.97);transition:transform .3s cubic-bezier(.2,1.3,.4,1);
    max-height:100%;overflow:auto;overscroll-behavior:contain;
  }
  .overlay.show .panel{transform:none}
  .panel h1{font-size:23px;margin:6px 0 4px;letter-spacing:1px;color:#4c4058}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .panel h1.title{background:linear-gradient(135deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
  }
  .panel h2{font-size:20px;margin:2px 0 10px;color:#4c4058}
  .panel .sub{font-size:12px;line-height:1.7;color:#9a8cab;margin:0 0 10px}
  .panel .logo{font-size:26px;letter-spacing:5px;filter:saturate(1.15)}
  .kicker{display:inline-block;color:#fff;font-size:11px;font-weight:900;letter-spacing:1.5px;border-radius:99px;padding:4px 14px;margin:2px 0 8px;
    background:linear-gradient(135deg,var(--ac1),var(--ac2));}
  .goalgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 12px}
  .gitem{display:inline-flex;align-items:center;gap:6px;background:#f8f4ff;border:1px solid #efe7fa;border-radius:99px;padding:7px 14px;
    font-size:13px;font-weight:800;color:#57486a}
  .gitem em{font-style:normal;font-size:10px;color:#a99cb8;font-weight:700}
  .tip{font-size:11.5px;line-height:1.8;color:#a99cb8;margin:0;background:#faf6ff;border-radius:14px;padding:9px 12px;text-align:left}
  .tip b{color:#7a5bb0}
  .starsum{font-size:11.5px;font-weight:800;color:#8b7c9b;background:#f6f0ff;border-radius:99px;padding:5px 13px;display:inline-block;margin:0 0 4px}
  .lvlist{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px}
  .lvitem{
    display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:16px;
    background:#fbf8ff;border:1px solid #f1e8fa;cursor:pointer;text-align:left;font-family:inherit;
    transition:transform .13s,box-shadow .16s,background .16s;
  }
  .lvitem:not(.locked):hover{background:#f7f1ff;box-shadow:0 10px 22px -8px rgba(150,120,200,.35);transform:translateY(-1px)}
  .lvitem:active{transform:scale(.98)}
  .lvitem.locked{opacity:.45;cursor:not-allowed}
  .lvbadge{
    width:27px;height:27px;border-radius:9px;color:#fff;font-weight:900;font-size:13px;
    display:grid;place-items:center;flex:0 0 auto;box-shadow:0 4px 8px -2px rgba(150,110,90,.35);
    background:linear-gradient(135deg,var(--ac1),var(--ac2));
  }
  .lvinfo{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .lvinfo b{font-size:13.5px;color:#57486a}
  .lvinfo em{font-style:normal;font-size:10.5px;color:#a99cb8}
  .lvstars{font-size:11px;color:#ffc55c;letter-spacing:1.5px;flex:0 0 auto}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:100px;border:0;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:800;
    font-family:inherit;color:#7b6b8c;background:#f3edfa;cursor:pointer;
    transition:transform .12s,filter .15s;
  }
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:scale(.96)}
  .btn.primary{
    background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;
    box-shadow:0 12px 24px -8px rgba(255,130,150,.55);
  }
  .ribbon{
    display:inline-block;font-size:13px;font-weight:900;color:#fff;border-radius:99px;padding:5px 16px;margin:2px 0 8px;
    background:linear-gradient(135deg,#57d98f,#2fb26a);box-shadow:0 8px 16px -6px rgba(47,178,106,.5);
  }
  .ribbon.bad{background:linear-gradient(135deg,#ff8f9c,#ff5f7a);box-shadow:0 8px 16px -6px rgba(255,95,122,.5)}
  .stars{font-size:34px;letter-spacing:8px;margin:4px 0 2px;height:42px}
  .star{display:inline-block;color:#ffc55c;opacity:0;transform:scale(.2) rotate(-25deg);
    animation:starIn .6s cubic-bezier(.2,1.6,.4,1) forwards;
    filter:drop-shadow(0 3px 6px rgba(255,180,70,.45));
  }
  .star.off{color:#e9e1f2;filter:none}
  @keyframes starIn{to{opacity:1;transform:none}}
  .big{font-size:36px;font-weight:900;color:#ff7a5f;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0}
  .rowline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#a99cb8;margin:4px 0 10px;flex-wrap:wrap}
  .newbest{display:inline-block;font-size:12px;font-weight:900;color:#e0821f;background:#fff3d9;border-radius:99px;padding:4px 12px;margin:2px 0 6px}
  /* 第一阶段：采摘信息优先，棋盘与天气紧密衔接。 */
  .hud{padding:14px 16px 10px;gap:12px;background:#fffdf9;z-index:2;border-bottom:1px solid #efe5d8}
  .lvchip b{color:#514b43;font-size:16px}
  .icon-btn{width:38px;height:38px;border-radius:13px;color:#786d60;border-color:#eee7dd}
  .orders{gap:7px}
  .ochip{padding:7px 10px;gap:7px;border-radius:13px;color:#736859;font-size:13px;border-color:#efe6d9}
  .ochip b{font-size:18px;color:#514b43}
  .ochip .fsq{width:24px;height:24px;border-radius:7px;position:relative;overflow:hidden}
  .ochip small{font-size:10px;color:#817568}
  .movesbox{padding:7px 12px;min-width:70px;background:#fff2df;border-color:#f0d8b8}
  .movesbox b{font-size:29px;color:#875334}
  .movesbox em{font-size:10px;color:#876e54;letter-spacing:0}
  .movesbox.low b{animation:none}
  .forecast{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:9px 12px;border:1px solid #dce8e1;border-radius:14px;background:#edf6f0;color:#416450;text-align:left;cursor:pointer;font-family:inherit}
  .forecast #forecastText{font-size:13px;font-weight:900}
  .forecast #forecastDetail{margin-left:auto;font-size:11px;line-height:1.5;color:#526e60}
  .forecast b{font-size:20px}
  .forecast.armed{background:#fff4d8;border-color:#ebcf87;color:#79561c}
  .forecast.urgent{border-color:#d49e75}
  .forecast:disabled{cursor:default}
  .path-preview{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 10px;background:rgba(255,253,248,.96);border:1px solid #e8ddcc;border-radius:20px;text-align:center;pointer-events:none;box-shadow:0 6px 18px rgba(100,80,50,.06)}
  .preview-kicker{font-size:10px;letter-spacing:1px;font-weight:800;color:#82725c}
  .path-preview b{font-size:17px;color:#4e5741;line-height:1.35}
  .path-preview>span:last-child{font-size:12px;line-height:1.5;color:#756b5e}
  .path-preview.reward{background:#fff4d9;border-color:#e6bd65}
  .path-preview.reward b{color:#8b541c}
  .path-preview[hidden],.forecast[hidden]{display:none}
  .panel .sub{color:#756b7d;font-size:13px}
  .tip{color:#726379;font-size:12px}
  .lvinfo em{color:#7c7084;font-size:11px;line-height:1.5}
  .menu-hero{font-size:12px;color:#608268;font-weight:800;letter-spacing:2px;margin:0 0 10px}
  .menu-continue{width:100%;margin:12px 0 8px;min-height:50px;font-size:16px}
  .menu-links{display:flex;justify-content:center;margin-top:12px}
  .menu-links button{border:0;background:transparent;color:#796787;font-family:inherit;font-size:12px;font-weight:700;padding:10px;cursor:pointer}
  .app.is-menu .hud-mid{display:none}
  .icon-btn:disabled{opacity:.4;cursor:default}
  .fsq[data-fruit="0"]::after{content:'⠿';position:absolute;inset:0;color:#fff8d5;text-align:center;font-size:19px;line-height:24px}
  .fsq[data-fruit="1"]::after{content:'✳';position:absolute;inset:0;color:#fffbe0;text-align:center;font-size:21px;line-height:24px}
  .fsq[data-fruit="2"]::after{content:'✦';position:absolute;inset:0;color:#dfe5ff;text-align:center;font-size:18px;line-height:24px}
  .fsq[data-fruit="3"]::after{content:'⁙';position:absolute;inset:0;color:#e2bdf9;text-align:center;font-size:24px;line-height:21px}
  .fsq[data-fruit="4"]::after{content:'◜';position:absolute;inset:0;color:#fff4da;text-align:center;font-size:24px;line-height:24px}
  .fsq[data-fruit="5"]::after{content:'∴';position:absolute;inset:0;color:#ffdfac;text-align:center;font-size:23px;line-height:24px}
  @media(max-width:370px){.hud{padding:10px;gap:8px}.ochip{padding:6px;gap:4px}.forecast #forecastDetail{font-size:10px}.path-preview{left:10px;right:10px}.path-preview b{font-size:15px}}
  @media(max-height:660px){.hud{padding:8px 10px;gap:6px}.icon-btn{width:32px;height:32px}.forecast{min-height:36px;padding:6px 9px}.ochip{padding:4px 7px;gap:5px}.ochip .fsq{width:19px;height:19px}.ochip b{font-size:16px}.ochip .fsq::after{line-height:19px;font-size:18px}.movesbox{padding:5px 9px}.movesbox b{font-size:25px}.path-preview{min-height:86px;padding:9px;bottom:10px}.path-preview b{font-size:15px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  .lesson-panel{padding:18px 16px;max-width:350px}
  .overlay:has(.lesson-panel){position:fixed;inset:0;padding:16px}
  .lesson-panel h2{font-size:20px;line-height:1.4;margin:10px 0 4px;color:#4d5947}
  .lesson-groups,.lesson-topics{display:flex;gap:5px;justify-content:center;margin:0 0 8px}
  .lesson-groups button,.lesson-topics button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 12px;color:#736b61;background:#f5f1e9;font-size:12px;font-weight:800}
  .lesson-groups button{flex:1}
  .lesson-groups button[aria-pressed="true"],.lesson-topics button[aria-pressed="true"]{background:#e5f0df;color:#426438;box-shadow:inset 0 0 0 1px #c8dcbf}
  .lesson-topics button{background:transparent;padding:6px 8px;font-size:11px}
  .lesson-copy{font-size:13px;line-height:1.65;color:#766b5a;margin:0 0 8px;min-height:22px}
  .lesson-demo{margin:6px 0 0;background:linear-gradient(#faf5e9,#f2ecd9);border-radius:20px;border:1px solid #e9dfc8;overflow:hidden}
  .lesson-demo svg{display:block;width:100%;height:auto;max-height:245px}
  .lesson-phase{position:relative;height:29px;font-size:12px;color:#61704d;font-weight:800}
  .lesson-phase span{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
  .lesson-phase .after{animation:lesson-after 5s infinite}
  .lesson-phase .before{animation:lesson-before 5s infinite}
  .lesson-controls{display:flex;justify-content:center;gap:16px;margin:4px 0}
  .lesson-controls button{font:inherit;font-size:11px;color:#7c7367;border:0;background:transparent;cursor:pointer;padding:7px}
  .lesson-next{width:100%;min-height:42px;border:1px solid #e6dfd0;background:#fffaf0;border-radius:12px;color:#70604a;font-family:inherit;font-size:12px;cursor:pointer;margin:5px 0 0}
  .lesson-panel .btns{margin-top:9px}
  .lesson-panel .btn{min-width:70px}
  .lesson-goals{font-size:11px;color:#756951;margin:5px 0 9px;display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}
  .lesson-goals span{display:inline-flex;gap:4px;align-items:center}
  .demo-line{stroke-dasharray:1;stroke-dashoffset:1;animation:lesson-line 5s infinite}
  .demo-undo-line{animation:lesson-undo 5s infinite}
  .demo-picked{transform-box:fill-box;transform-origin:center;animation:lesson-pop 5s infinite}
  .demo-result{animation:lesson-after 5s infinite}
  .demo-initial{animation:lesson-before 5s infinite}
  .demo-ice{animation:lesson-ice 5s infinite}
  .demo-rain{animation:lesson-rain 5s infinite}
  .demo-boost{animation:lesson-boost 5s infinite}
  .demo-wind{animation:lesson-wind 5s infinite}
  .demo-wind-wrap{animation:lesson-wrap 5s infinite}
  .demo-finger{animation:lesson-finger 5s infinite}
  .lesson-paused *{animation-play-state:paused!important}
  @keyframes lesson-line{0%,12%{stroke-dashoffset:1;opacity:1}60%,70%{stroke-dashoffset:0;opacity:1}78%,100%{stroke-dashoffset:0;opacity:0}}
  @keyframes lesson-undo{0%,12%{stroke-dashoffset:1;opacity:1}42%{stroke-dashoffset:0;opacity:1}65%,90%{stroke-dashoffset:.5;opacity:1}100%{stroke-dashoffset:1;opacity:0}}
  @keyframes lesson-pop{0%,65%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1.14)}82%,96%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
  @keyframes lesson-after{0%,68%{opacity:0}76%,96%{opacity:1}100%{opacity:0}}
  @keyframes lesson-before{0%,64%{opacity:1}72%,96%{opacity:0}100%{opacity:1}}
  @keyframes lesson-ice{0%,10%{opacity:0}25%,65%{opacity:1}80%,100%{opacity:0}}
  @keyframes lesson-rain{0%,10%{opacity:0;transform:translateY(-14px)}25%,40%{opacity:1}55%,100%{opacity:0;transform:translateY(45px)}}
  @keyframes lesson-boost{0%,28%{opacity:0}40%,70%{opacity:1}82%,100%{opacity:0}}
  @keyframes lesson-wind{0%,25%{transform:translateX(0)}60%,92%{transform:translateX(-54px)}100%{transform:translateX(0)}}
  @keyframes lesson-wrap{0%,25%{transform:translateX(0)}60%,92%{transform:translateX(162px)}100%{transform:translateX(0)}}
  @keyframes lesson-finger{0%,7%{opacity:0}12%,63%{opacity:1}72%,100%{opacity:0}}
  @media(max-height:660px){.lesson-panel{padding:12px}.lesson-panel>.kicker,.lesson-next{display:none}.lesson-demo{margin-top:4px}.lesson-demo svg{max-height:150px}.lesson-panel h2{font-size:18px;margin:5px 0}.lesson-groups,.lesson-topics{margin-bottom:4px}.lesson-groups button{padding:7px}.lesson-topics button{padding:5px 7px}.lesson-panel .btn{padding:10px}.lesson-panel .btns{margin-top:6px}.lesson-copy{font-size:12px;min-height:18px;margin-bottom:4px}.lesson-phase{height:23px}.lesson-controls{margin:0}.lesson-controls button{padding:5px}}
  @media(prefers-reduced-motion:reduce){.lesson-demo *{animation:none!important}.lesson-demo .demo-result{opacity:1}.lesson-demo .demo-picked,.lesson-demo .demo-initial{opacity:.3}.lesson-demo .demo-line{stroke-dashoffset:0}.lesson-demo .demo-finger,.lesson-demo .demo-rain,.lesson-demo .demo-ice{display:none}.lesson-demo .demo-wind{transform:translateX(-54px)}.lesson-demo .demo-wind-wrap{transform:translateX(162px)}.lesson-phase .before{display:none}.lesson-phase .after{opacity:1}}
  /* Soft orchard: natural silhouettes, quiet surfaces, explicit state labels. */
  body{color:#4e5e4f;background:#f0f3eb}
  .app{background:#fafbf6;box-shadow:0 14px 55px rgba(63,84,57,.1);outline-color:#e1e8da}
  .hud{background:#fafbf6;border-color:#e5ebdf;padding:13px 15px 10px;gap:10px}
  .lvchip b{color:#4e624f;letter-spacing:.5px}
  .lvchip span{border-radius:8px;box-shadow:none;letter-spacing:0;padding:4px 7px;background:#e6eee0;color:#66825d}
  .icon-btn{background:#fffef9;border:1px solid #e2e8da;box-shadow:none;color:#79916c;font-size:14px}
  .hud-mid{gap:9px}
  .orders{gap:6px}
  .ochip{background:#fffef9;border:1px solid #e4e9dc;box-shadow:none;gap:5px;padding:5px 8px;border-radius:14px}
  .ochip b{color:#53674d;font-size:19px}

function hex2rgb(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, k){
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * k) + ',' + Math.round(A[1] + (B[1] - A[1]) * k) + ',' + Math.round(A[2] + (B[2] - A[2]) * k) + ')';
}
function applyThemeVars(){
  const t = theme(), s = document.documentElement.style;
  s.setProperty('--ac1', t.ac1);
  s.setProperty('--ac2', t.ac2);
}

   2. 存档
   ========================================================= */
const SAVE_KEY = 'fruitmatch.save.v1';
function defProg(){ return {unlocked:1, allLevelsOpen:false, best:new Array(LEVEL_N).fill(0), stars:new Array(LEVEL_N).fill(0), campaignVersion:2, seenWx:[], seenTools:[], seenOrchard:[], seenWeatherIntro:false, seenWeatherGuide:[], seenBasics:false, hasStarted:false}; }
let save = {sound:true, m:defProg()};
try{
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){
    const o = JSON.parse(raw);
    save.sound = o.sound !== false;
    if(o.m){
      const p = defProg();
      p.seenBasics = o.m.seenBasics === true;
      p.seenTools=Array.isArray(o.m.seenTools)?o.m.seenTools.filter(k=>TOOL_KEYS.includes(k)):[];
      p.seenOrchard=Array.isArray(o.m.seenOrchard)?o.m.seenOrchard.filter(k=>ORCHARD.lessons[k]):[];
      p.allLevelsOpen=o.m.allLevelsOpen===true;
      p.hasStarted = o.m.hasStarted===true || o.m.seenBasics===true || Number(o.m.unlocked)>1 || (Array.isArray(o.m.best)&&o.m.best.some(v=>Number(v)>0));
      p.seenWeatherIntro = o.m.seenWeatherIntro === true;
      if(Array.isArray(o.m.seenWeatherGuide))p.seenWeatherGuide=o.m.seenWeatherGuide.filter(k=>['rain','wind','frost'].includes(k));
      const u = parseInt(o.m.unlocked, 10);
      if(u >= 1 && u <= LEVEL_N) p.unlocked = u;
      if(Array.isArray(o.m.best))  for(let i=0;i<LEVEL_N;i++){ const v=parseInt(o.m.best[i],10);  if(v>0) p.best[i]=v; }
      if(Array.isArray(o.m.stars)) for(let i=0;i<LEVEL_N;i++){ const v=parseInt(o.m.stars[i],10); if(v>0) p.stars[i]=Math.min(3,v); }
      /* 天气教学卡：只认合法天气名（旧存档迁移） */
      if(Array.isArray(o.m.seenWx)) p.seenWx = o.m.seenWx.filter(x => x === 'rain' || x === 'wind' || x === 'frost');
      if(o.m.campaignVersion!==2){
        p.legacyFive={unlocked:o.m.unlocked,best:o.m.best,stars:o.m.stars};
        p.best=new Array(LEVEL_N).fill(0);p.stars=new Array(LEVEL_N).fill(0);
        for(let i=0;i<5;i++){const j=[2,5,8,11,14][i];p.best[j]=Number(o.m.best?.[i])||0;p.stars[j]=Math.min(3,Number(o.m.stars?.[i])||0);}
        p.unlocked=Number(o.m.stars?.[4])>0?Math.min(16,LEVEL_N):Math.min(LEVEL_N,Math.max(1,((Number(o.m.unlocked)||1)-1)*3+1));
      }else if(o.m.legacyFive)p.legacyFive=o.m.legacyFive;
      if(o.m.campaignVersion===2&&Number(o.m.stars?.[14])>0)p.unlocked=Math.max(p.unlocked,16);
      if(o.m.campaignVersion===2&&Number(o.m.stars?.[29])>0)p.unlocked=Math.max(p.unlocked,31);
      save.m = p;
    }
  }
}catch(e){}

function selectPocketTool(id){
  if(G.state!=='play'||G.phase!=='idle'||!TOOL_INFO[id]||!(G.tools[id]>0))return false;
  const cancel=G.activeTool===id;clearGesture();cancelTool();G.hint=null;G.hintT=0;if(!cancel)G.activeTool=id;

function usePocketTool(cell){
  const id=G.activeTool;
  if(G.state!=='play'||G.phase!=='idle'||!TOOL_INFO[id]||!(G.tools[id]>0)||!cell||cell.r<0||cell.r>=8||cell.c<0||cell.c>=8)return false;
  const target=G.grid[cell.r][cell.c];if(!target)return false;
  if(id==='glove'){
    if(target.frost){G.toolMessage='冰块不能交换，试试剪刀或篮子';return false;}
    if(!G.swapSource){G.swapSource={...cell};G.toolMessage='再点相邻的一颗水果';return false;}
    const first=G.swapSource,from=G.grid[first.r][first.c];
    if(first.r===cell.r&&first.c===cell.c){G.swapSource=null;G.toolMessage='重新选第一颗水果';return false;}
    if(Math.max(Math.abs(first.r-cell.r),Math.abs(first.c-cell.c))!==1){G.toolMessage='请选择旁边的一颗，可以斜着换';return false;}
    if(from.type===target.type&&from.special===target.special){G.toolMessage='这两颗相同，换其他水果试试';return false;}
    G.grid[first.r][first.c]=target;G.grid[cell.r][cell.c]=from;
    Object.assign(target,{r:first.r,c:first.c,x:colX(first.c),y:rowY(first.r),bornT:.2});
    Object.assign(from,{r:cell.r,c:cell.c,x:colX(cell.c),y:rowY(cell.r),bornT:.2});
  }
  const seeds=[];
  if(id==='scissors')seeds.push({...cell});
  if(id==='basket')for(let r=Math.max(0,cell.r-1);r<=Math.min(7,cell.r+1);r++)for(let c=Math.max(0,cell.c-1);c<=Math.min(7,cell.c+1);c++)seeds.push({r,c});
  G.tools[id]--;G.toolUses[id]++;cancelTool();G.combo=1;G.autoMade=0;G.weatherPending=false;
  updateOrders();sfxSpawn();
  if(id==='glove')nextCascadeStep(true);
  else{
    for(const {r,c}of seeds)G.grid[r][c].frost=0;
    startRemoval(seeds);
  }
  return true;
}

function levelSignature(i){const c=LEVELS[i];return JSON.stringify([c.types,c.moves,c.goals,c.weatherEvery,c.weatherPool,c.bomb,c.rainbow,c.loop,c.autoTools].concat(c.tools?[c.tools]:[],c.orchard?[c.orchard]:[]));}
function compatibleLevelSignature(i,signature){
  const current=levelSignature(i);if(signature===current)return true;
  // Only the early-loop availability changed. Preserve those old in-progress boards.
  if(i>=5)return false;
  const previous=JSON.parse(current);previous[7]=false;
  return signature===JSON.stringify(previous);
}
function readSavedRun(){
  try{
    const r=JSON.parse(localStorage.getItem(RUN_KEY)||'null');
    if(!r||r.version!==1||!Number.isInteger(r.level)||r.level<0||r.level>=LEVEL_N||!compatibleLevelSignature(r.level,r.signature))return null;
    const c=LEVELS[r.level],validInt=(n,max)=>Number.isInteger(n)&&n>=0&&n<=max;
    const cell=p=>p&&validInt(p.r,7)&&validInt(p.c,7);
    if(!validInt(r.moves,c.moves)||r.moves<1||!validInt(r.score,1e9)||!validInt(r.maxCombo,1e6))return null;
    if(typeof r.wxArmed!=='boolean'||typeof r.teachBasics!=='boolean')return null;
    const specials=[null,'bomb','rainbow',...(c.orchard?.burst?['burst']:[]),...(c.orchard?.cycle?['cycle']:[])];
    if(!Array.isArray(r.grid)||r.grid.length!==8||r.grid.some(row=>!Array.isArray(row)||row.length!==8||row.some(t=>!t||!Number.isInteger(t.type)||t.type< -1||t.type>=c.types||!specials.includes(t.special)||((t.type===-1)!==(t.special==='rainbow'))||!validInt(t.frost,1)||!validInt(t.boost,1))))return null;
    if(!r.stats||!validInt(r.stats.bombMade,1e6)||!validInt(r.stats.rainbowMade,1e6)||!Array.isArray(r.collected)||r.collected.length!==c.goals.length||r.collected.some(n=>!validInt(n,1e6)))return null;
    if(!validInt(r.weatherLeft,c.weatherEvery||99)||r.weatherLeft<1||!Array.isArray(r.wxQueue)||r.wxQueue.length>6||r.wxQueue.some(k=>!c.weatherPool.includes(k)))return null;
    if(c.weatherEvery ? !c.weatherPool.includes(r.forecast) : r.forecast!==null)return null;
    if(r.weatherPlan){
      const p=r.weatherPlan;
      if(p.name!==r.forecast||!Array.isArray(p.cells)||p.cells.length>6||!p.cells.every(cell)||!Array.isArray(p.rows)||p.rows.length>2||p.rows.some(v=>!validInt(v,7)))return null;
    }
    if(r.lessonRoute!==null&&(!Array.isArray(r.lessonRoute)||r.lessonRoute.length>8||!r.lessonRoute.every(cell)))return null;
    const limits=toolAllowance(c);
    if(r.tools===undefined&&!c.tools){r.tools=limits;r.toolUses={scissors:0,glove:0,basket:0};}
    if(!r.tools||!r.toolUses||TOOL_KEYS.some(k=>!validInt(r.tools[k],limits[k])||!validInt(r.toolUses[k],limits[k])||r.tools[k]+r.toolUses[k]!==limits[k]))return null;
    if(Object.keys(r.tools).some(k=>!TOOL_KEYS.includes(k)))return null;
    if(r.orchard===undefined&&!c.orchard)r.orchard=freshOrchard(c);
    if(!validOrchard(r.orchard,c))return null;
    return r;
  }catch(e){return null;}
}

function saveRun(){

/* Garden progress is independent of campaign unlocks and survives exact-board saves. */
function freshOrchard(c){return {flowers:(c.orchard?.flowers||[]).map(([r,c])=>r*8+c),gathered:0,burst:0,cycle:0,bee:0,charge:0};}
function validOrchard(v,c){
  if(!v||!Array.isArray(v.flowers)||new Set(v.flowers).size!==v.flowers.length)return false;
  const initial=freshOrchard(c),ints=['gathered','burst','cycle','bee','charge'];
  if(ints.some(k=>!Number.isInteger(v[k])||v[k]<0||v[k]>1e6))return false;
  if(v.flowers.some(k=>!initial.flowers.includes(k))||v.flowers.length+v.gathered!==initial.flowers.length)return false;
  if(v.charge>=(c.orchard?.bee?.charges||1))return false;
  if((!c.orchard?.burst&&v.burst)||(!c.orchard?.cycle&&v.cycle)||(!c.orchard?.bee&&(v.bee||v.charge)))return false;
  return true;
}
function featureIcon(id){return '<span class="feature-icon">'+ORCHARD.icon(id)+'</span>';}
function nextOrchardLesson(c=cfg()){
  const order=[c.introFeature,...Object.keys(ORCHARD.lessons)].filter(Boolean);
  return order.find(id=>c.orchard?.[id]&&!prog().seenOrchard.includes(id));
}
function teachOrchard(c=cfg()){const id=nextOrchardLesson(c);if(id)showLesson(id,'play','feature-intro','果园新发现');}
function decorateFruit(t){
  const c=cfg().orchard;if(!c||t.special)return t;
  const x=Math.random();if(x<(c.burst||0))t.special='burst';else if(x<(c.burst||0)+(c.cycle||0))t.special='cycle';
  return t;
}
function collectOrchard(marked){
  for(const k of marked){
    const t=G.grid[Math.floor(k/8)][k%8];
    if(t?.special==='burst')G.orchard.burst++;
    if(t?.special==='cycle')G.orchard.cycle++;
    const i=G.orchard.flowers.indexOf(k);
    if(i>=0){G.orchard.flowers.splice(i,1);G.orchard.gathered++;burst(colX(k%8),rowY(Math.floor(k/8)),'#d69ab6',7);floatText(colX(k%8),rowY(Math.floor(k/8))-TILE*.5,'✿ +1','#c481a1',14);}
  }
}
function cycleFruits(){
  if(!G.colorPending)return false;G.colorPending=false;
  let changed=false;
  forEachCell(t=>{if(t.special==='cycle'&&!t.frost){t.type=(t.type+1)%G.types;t.bornT=.32;changed=true;burst(t.x,t.y,'#b4a2ce',3);}});
  if(changed)floatText(W/2,BY+TILE*.4,'↻ 变色了','#9c87b4',13);
  return changed;
}
function beeTargets(p){
  const b=cfg().orchard?.bee;if(!b||pathLength(p)<b.chain||G.orchard.charge+1<b.charges)return [];
  const excluded=planRemovals(p),list=[];
  forEachCell((t,r,c)=>{const k=key(r,c);if(t.type<0||t.frost||t.spawnKeep||excluded.has(k))return;
    const need=orderFor(t.type);list.push({r,c,priority:(need&&orderGot(need)<need.n?20:0)+(G.orchard.flowers.includes(k)?10:0)+(t.special==='burst'?4:0)});});
  return list.sort((a,b)=>b.priority-a.priority||a.r-b.r||a.c-b.c).slice(0,b.picks).map(({r,c})=>({r,c}));
}
function chargeBee(p){
  const b=cfg().orchard?.bee;if(!b||pathLength(p)<b.chain)return [];
  const targets=beeTargets(p);G.orchard.charge++;
  if(G.orchard.charge<b.charges)return [];
  G.orchard.charge=0;G.orchard.bee++;
  G.beeFlights=targets.map(v=>({x:colX(v.c),y:rowY(v.r),t:0,life:.32}));
  floatText(W/2,BY+TILE*.8,'🐝 蜜蜂来帮忙！','#b39451',17);sfxSpawn();
  return targets;
}

let audioOn = save.sound !== false;
let actx = null;
function ac(){
  if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
  return actx;
}
function blip(freq, dur, type, gain, slide){
  if(!audioOn) return;
  try{
    const a = ac(); if(!a) return;
    if(a.state === 'suspended') a.resume();
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, freq + slide), t + dur);
    g.gain.setValueAtTime(gain || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}

let lastBombSound=-1;
function sfxBomb(){
  if(!audioOn)return;
  try{
    const a=ac();if(!a)return;
    if(a.state==='suspended')a.resume();
    const t=a.currentTime;
    if(t-lastBombSound<.07)return;
    lastBombSound=t;
    for(const [freq,duration,gain,delay]of [[220,.13,.035,0],[523.25,.19,.022,.015],[783.99,.22,.014,.035]]){
      const o=a.createOscillator(),g=a.createGain(),at=t+delay;
      o.type='sine';o.frequency.setValueAtTime(freq,at);
      if(freq===220)o.frequency.exponentialRampToValueAtTime(150,at+duration);
      g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(gain,at+.009);
      g.gain.exponentialRampToValueAtTime(.0001,at+duration);
      o.connect(g);g.connect(a.destination);o.start(at);o.stop(at+duration+.02);
    }
  }catch(e){}
}

/* =========================================================
   5. 布局
   ========================================================= */
let W = 0, H = 0, DPR = 1, TILE = 40, BX = 0, BY = 0;

function rr(x, y, w, h, r){
  const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function colX(c){ return BX + c * TILE + TILE / 2; }
function rowY(r){ return BY + r * TILE + TILE / 2; }
function cellFromPoint(x, y){
  const c = Math.floor((x - BX) / TILE), r = Math.floor((y - BY) / TILE);
  if(r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return {r, c};
}
function key(r, c){ return r * COLS + c; }

function computeLayout(){
  const reserve=cfg().tools?((window.innerHeight||800)<=660?160:190):142;
  TILE = Math.max(12, Math.floor(Math.min((W - 22) / COLS, (H - reserve) / ROWS)));
  BX = Math.round((W - TILE * COLS) / 2);
  BY = 16;
}
function resize(){
  const r = stageEl.getBoundingClientRect();
  W = Math.max(200, Math.round(r.width));
  H = Math.max(260, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeLayout();
}
window.addEventListener('resize', resize);
if(window.ResizeObserver){ new ResizeObserver(() => resize()).observe(stageEl); }

/* =========================================================
   6. 盘面生成与工具
   ========================================================= */
function forEachCell(fn){
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    const t = G.grid[r][c]; if(t) fn(t, r, c);
  }
}
function makeTile(type, r, c, special){
  return {id:G.nextId++, type, special:special || null, r, c,
          x:colX(c), y:rowY(r), vy:0, state:'idle',
          popT:0, squashT:0, bornT:0, spawnKeep:false, frost:0, boost:0};
}
function orderFor(fruit){ return G.orders.find(o => o.kind === 'fruit' && o.fruit === fruit); }
function orderGot(o){
  if(o.kind==='tool')return G.toolUses[o.tool]||0;
  if(o.kind==='feature')return G.orchard[o.feature==='flowers'?'gathered':o.feature]||0;
  if(o.kind === 'fruit') return o.got;
  return o.special === 'bomb' ? G.stats.bombMade : G.stats.rainbowMade;
}
function allGoalsDone(){ return G.orders.every(o => orderGot(o) >= o.n); }

/* 出牌加权：订单水果更容易出现（保证不难） */
function randType(){
  const n = G.types;
  /* 6 种水果时订单加权更高，补偿出牌密度下降（保住"不难"） */
  const bias = 1.25 + (n - 5) * 0.15;
  let total = 0; const w = [];
  for(let i = 0; i < n; i++){ const wi = orderFor(i) ? bias : 1; w.push(wi); total += wi; }
  let x = Math.random() * total;
  for(let i = 0; i < n; i++){ x -= w[i]; if(x <= 0) return i; }
  return n - 1;
}

function fillBoard(){
  let guard = 0;
  do{
    G.grid = [];
    for(let r = 0; r < ROWS; r++){
      const row = [];
      for(let c = 0; c < COLS; c++){
        let type, tries = 0;
        do{
          type = randType(); tries++;
        }while(tries < 40 && (
          (c >= 2 && row[c-1].type === type && row[c-2].type === type) ||
          (r >= 2 && G.grid[r-1][c].type === type && G.grid[r-2][c].type === type) ||
          /* 避免现成 2×2 同款方块：成圈必须靠玩家在局中创造 */
          (c >= 1 && r >= 1 && row[c-1].type === type && G.grid[r-1][c].type === type && G.grid[r-1][c-1].type === type)
        ));
        row.push(decorateFruit(makeTile(type, r, c)));
      }
      G.grid.push(row);
    }
  }while(!hasAnyMove() && ++guard < 20);
}

/* =========================================================
   7. 匹配检测（含 run 合并 → L/T 形）
   ========================================================= */
function findMatches(){
  const runs = [];
  for(let r = 0; r < ROWS; r++){
    let c = 0;
    while(c < COLS){
      const t = G.grid[r][c];
      if(t && t.type >= 0){
        let len = 1;
        while(c + len < COLS){
          const t2 = G.grid[r][c + len];
          if(t2 && t2.type === t.type) len++; else break;
        }
        if(len >= 3){
          const cells = [];
          for(let i = 0; i < len; i++) cells.push({r, c:c + i});
          runs.push({cells, dir:'h', len});
        }
        c += len;
      }else c++;
    }
  }
  for(let c = 0; c < COLS; c++){
    let r = 0;
    while(r < ROWS){
      const t = G.grid[r][c];
      if(t && t.type >= 0){
        let len = 1;
        while(r + len < ROWS){
          const t2 = G.grid[r + len][c];
          if(t2 && t2.type === t.type) len++; else break;
        }
        if(len >= 3){
          const cells = [];
          for(let i = 0; i < len; i++) cells.push({r:r + i, c});
          runs.push({cells, dir:'v', len});
        }
        r += len;
      }else r++;
    }
  }
  /* 合并共享格子的 run → 同一组 */
  const used = new Array(runs.length).fill(false);
  const groups = [];
  for(let i = 0; i < runs.length; i++){
    if(used[i]) continue;
    let cells = runs[i].cells.slice();
    let maxLen = runs[i].len;
    const dirs = new Set([runs[i].dir]);
    used[i] = true;
    let changed = true;
    while(changed){
      changed = false;
      for(let j = 0; j < runs.length; j++){
        if(used[j]) continue;
        if(runs[j].cells.some(cc => cells.some(x => x.r === cc.r && x.c === cc.c))){
          cells = cells.concat(runs[j].cells.filter(cc => !cells.some(x => x.r === cc.r && x.c === cc.c)));
          maxLen = Math.max(maxLen, runs[j].len);
          dirs.add(runs[j].dir);
          used[j] = true; changed = true;
        }
      }
    }
    groups.push({cells, maxLen, cross:dirs.size > 1});
  }
  return groups;
}

/* =========================================================
   8. 可行步扫描 / 提示
   ========================================================= */
function typeView(){
  const T = [];
  for(let r = 0; r < ROWS; r++){
    const row = [];
    for(let c = 0; c < COLS; c++){
      const t = G.grid[r][c];
      row.push(t ? t.type : null);
    }
    T.push(row);
  }
  return T;
}
function runLenAt(T, r, c){
  const v = T[r][c];
  if(v == null || v < 0) return 0;
  let l = c; while(l > 0 && T[r][l-1] === v) l--;
  let rt = c; while(rt < COLS - 1 && T[r][rt+1] === v) rt++;
  const h = rt - l + 1;
  let u = r; while(u > 0 && T[u-1][c] === v) u--;
  let d = r; while(d < ROWS - 1 && T[d+1][c] === v) d++;
  return Math.max(h, d - u + 1);
}
/* 画线模式：找同款连通簇（8 向相邻，冰冻牌不算） */
function sameTypeNeighbors(r, c){
  const t = G.grid[r][c];
  if(!t || t.type < 0 || t.frost) return null;
  const nb = [];
  for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++){
    if(!dr && !dc) continue;
    const r2 = r + dr, c2 = c + dc;
    if(r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) continue;
    const t2 = G.grid[r2][c2];
    if(t2 && t2.type === t.type && !t2.frost) nb.push({r:r2, c:c2});
  }
  return nb.length >= 2 ? nb : null;
}
function findHint(){
  const roots=[];forEachCell((t,r,c)=>{if(!t.frost)roots.push({r,c,type:t.type,special:t.special});});
  const need=type=>{const o=orderFor(type);return o?Math.max(0,o.n-orderGot(o)):0;};
  roots.sort((a,b)=>need(b.type)-need(a.type));
  let best=null,bestScore=-Infinity,nodes=0,evaluations=0;
  function consider(p){
    if(evaluations++>450)return;
    const v=pathPreview(p);if(!v||(!v.reward&&v.n<3))return;
    let score=v.marked.size*.35,gain=0;
    for(const o of G.orders){
      if(o.kind==='fruit'){
        let n=0;for(const k of v.marked){const t=G.grid[Math.floor(k/COLS)][k%COLS];if(t.type===o.fruit)n+=t.boost?2:1;}
        gain+=Math.min(n,Math.max(0,o.n-orderGot(o)));
      }else if(o.kind==='feature'&&orderGot(o)<o.n){
        let n=0;for(const k of v.marked){const t=G.grid[Math.floor(k/8)][k%8];if(o.feature==='flowers'?G.orchard.flowers.includes(k):t.special===o.feature)n++;}
        score+=Math.min(n,o.n-orderGot(o))*35;
        if(o.feature==='bee'&&v.n>=(cfg().orchard?.bee?.chain||99))score+=90;
      }else if(orderGot(o)<o.n&&v.reward===o.special)score+=160;
    }
    score+=gain*9;
    if(v.reward==='bomb'||v.reward==='rainbow')score+=14;
    if(v.loop)score+=8;
    if(G.forecast&&!G.wxArmed&&(v.n>=6||v.loop))score+=8;
    const thaw=new Set();
    for(const k of v.marked){const r=Math.floor(k/COLS),c=k%COLS;
      for(const [dr,dc]of [[0,1],[0,-1],[1,0],[-1,0]]){const rr=r+dr,cc=c+dc;if(G.grid[rr]?.[cc]?.frost)thaw.add(key(rr,cc));}
    }
    score+=thaw.size*5;
    if(score>bestScore){bestScore=score;best={cells:p.map(c=>({...c})),reason:gain?'优先完成订单':v.reward==='bomb'||v.reward==='rainbow'?'制作订单需要的道具':thaw.size?'先解冻，再连线':'调整棋盘，寻找新机会'};}
  }
  for(const root of roots){
    if(evaluations>450||nodes>2500)break;
    if(root.special==='rainbow'){consider([{r:root.r,c:root.c}]);continue;}
    if(root.type<0)continue;
    let branch=0;
    function visit(p){
      if(branch++>64||nodes++>2500)return;
      if(p.length===3||p.length===6||p.length===8)consider(p);
      if(p.length>=8)return;
      const last=p[p.length-1];
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        if(!dr&&!dc)continue;const r=last.r+dr,c=last.c+dc,t=G.grid[r]?.[c];
        if(!t||t.type!==root.type||t.frost)continue;
        const cell={r,c},closing=r===root.r&&c===root.c;
        if(closing){if(!canCloseLoop(p))continue;}
        else if(p.some(v=>v.r===r&&v.c===c))continue;
        let cross=false;
        for(let i=0;i<p.length-2;i++){if(closing&&i===0)continue;if(segmentsCross(last,cell,p[i],p[i+1])){cross=true;break;}}
        if(cross)continue;
        if(closing){const loop=p.concat([cell]);if(pathIsLoop(loop))consider(loop);}
        else visit(p.concat([cell]));
      }
    }
    visit([{r:root.r,c:root.c}]);
  }
  return best;
}
function hasAnyMove(){
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    if(G.grid[r]?.[c]?.special==='rainbow'&&!G.grid[r][c].frost)return true;
    if(sameTypeNeighbors(r, c)) return true;
  }
  return false;
}

function shuffleBoard(){
  const normals = [];
  forEachCell((t) => { if(t.type >= 0){ t.frost = 0; t.boost = 0; normals.push(t); } });
  let ok = false, guard = 0;
  while(!ok && guard++ < 60){
    const types = normals.map(t => t.type);
    for(let i = types.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = types[i]; types[i] = types[j]; types[j] = tmp;
    }
    normals.forEach((t, i) => t.type = types[i]);
    if(findMatches().length === 0 && hasAnyMove()) ok = true;
  }
  if(!ok) fillBoard();
  banner('🔀 重新洗牌');
  sfxShuffle();
  G.shuffleT = 0.5;
  G.phase = 'idle'; G.hintT = 0; G.hint = null;saveRun();
}

/* =========================================================
   9. 消除计划（炸弹/彩虹连锁扩散）
   ========================================================= */
function mostCommonType(){
  const count = new Array(G.types).fill(0);
  forEachCell(t => { if(t.type >= 0) count[t.type]++; });
  let best = -1, n = 0;
  for(let i = 0; i < G.types; i++) if(count[i] > n){ n = count[i]; best = i; }
  return n > 0 ? best : null;
}
function planRemovals(seeds, noChain, preserved){
  const marked = new Set();
  const queue = seeds.slice();
  const nc = new Set(noChain || []);
  while(queue.length){
    const cell = queue.shift();
    const k = key(cell.r, cell.c);
    if(marked.has(k)) continue;
    const t = G.grid[cell.r][cell.c];
    if(!t || t.spawnKeep || t.frost || (preserved && preserved.has(k))) continue;   /* 冰冻牌免疫消除，需相邻消除解冻 */
    marked.add(k);
    if(nc.has(k)) continue;
    if(t.special === 'bomb'){
      for(let i = 0; i < COLS; i++) if(i !== cell.c) queue.push({r:cell.r, c:i});
      for(let j = 0; j < ROWS; j++) if(j !== cell.r) queue.push({r:j, c:cell.c});
    }else if(t.special === 'burst'){
      for(let r=Math.max(0,cell.r-1);r<=Math.min(7,cell.r+1);r++)for(let c=Math.max(0,cell.c-1);c<=Math.min(7,cell.c+1);c++)queue.push({r,c});
    }else if(t.special === 'rainbow'){
      const tp = mostCommonType();
      if(tp != null) forEachCell((t2, r, c) => { if(t2.type === tp) queue.push({r, c}); });
    }
  }
  return marked;
}

/* =========================================================
   10. 消除执行 → 分数/订单 → 动画 → 重力
   ========================================================= */
function processMatchGroups(groups){
  const seeds = [];
  for(const g of groups){
    let kind = null;
    /* 自动连锁以收集为主：每次手动操作最多额外生成一个道具。 */
    if(cfg().autoTools && G.autoMade<1){
      if(g.cells.length>=8 && cfg().rainbow)kind='rainbow';
      else if(g.cells.length>=6 && cfg().bomb)kind='bomb';
    }
    let sc = null;
    if(kind){
      sc = g.cells[Math.floor(g.cells.length / 2)];
      const t = G.grid[sc.r][sc.c];
      if(t){
        t.spawnKeep = true; t.bornT = 0.35;
        if(kind === 'rainbow'){
          t.special = 'rainbow'; t.type = -1; G.autoMade++;
          addScore(200, {x:colX(sc.c), y:rowY(sc.r), label:'🌈 彩虹 +200'});
        }else{
          t.special = 'bomb'; G.autoMade++;
          addScore(100, {x:colX(sc.c), y:rowY(sc.r), label:'💥 炸弹 +100'});
        }
        sfxSpawn();
        updateOrders();
      }
    }
    for(const cc of g.cells){
      if(!(sc && cc.r === sc.r && cc.c === sc.c)) seeds.push(cc);
    }
  }
  return seeds;
}

function startRemoval(seeds, opts){
  opts = opts || {};
  const marked = planRemovals(seeds, opts.noChain);
  if(marked.size === 0) return false;
  collectOrchard(marked);

  let cnt = 0, cx = 0, cy = 0, boostN = 0;
  for(const k of marked){
    const r = Math.floor(k / COLS), c = k % COLS;
    const t = G.grid[r][c]; if(!t) continue;
    t.state = 'pop'; t.popT = 0;
    cnt++; cx += t.x; cy += t.y;
    if(t.boost) boostN++;
    if(t.type>=0) sliceFruit(t);
    burst(t.x, t.y, t.type >= 0 ? FRUITS[t.type].c2 : '#b4a4d3', t.boost ? 5 : 3);
    if(t.special === 'bomb'){ G.shake = Math.max(G.shake, 0.55); sfxBomb(); }
    if(t.special === 'burst'){G.shake=Math.max(G.shake,.22);burst(t.x,t.y,'#f4b48a',10);}
  }
  /* 分数与订单（✨双倍水果按 2 计） */
  const gain = (cnt + boostN) * 10 * Math.min(G.combo,3);
  addScore(gain, {x:cx / cnt, y:cy / cnt,
    label:'+' + gain + (G.combo > 1 ? ' ×' + Math.min(G.combo,3) : '') + (boostN ? ' ✨' : '')});
  for(const k of marked){
    const r = Math.floor(k / COLS), c = k % COLS;
    const t = G.grid[r][c];
    if(t && t.type >= 0){
      const o = orderFor(t.type);
      if(o) o.got += t.boost ? 2 : 1;
    }
  }
  for(const o of G.orders){
    if(o.kind === 'fruit' && !o.done && o.got >= o.n){
      o.done = true;
      banner('✅ ' + (o.n ? FRUITS[o.fruit].name + ' 订单完成！' : ''));
      sfxOrder();
    }
  }
  sfxMatch(G.combo);
  if(G.combo >= 2){
    banner('连锁 ' + G.combo + ' 次！');
    G.flashT = 0.22;
  }
  updateOrders();

  G.marked = marked;
  G.phase = 'pop';
  G.popT = POP_DUR;
  return true;
}

function applyRemovals(){
  for(const k of G.marked){
    const r = Math.floor(k / COLS), c = k % COLS;
    G.grid[r][c] = null;
    /* 相邻被消除 → 冰冻解封 */
    for(const d of [[0,1],[0,-1],[1,0],[-1,0]]){
      const r2 = r + d[0], c2 = c + d[1];
      if(r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) continue;
      const t2 = G.grid[r2][c2];
      if(t2 && t2.frost){
        t2.frost = 0; t2.bornT = 0.22;
        burst(colX(c2), rowY(r2), '#bcd9f2', 6);
        floatText(colX(c2), rowY(r2) - TILE * 0.5, '解冻！', '#6fa8dc', 12);
      }
    }
  }
  G.marked = new Set();
  forEachCell(t => { t.spawnKeep = false; });

  /* 重力 + 补牌（逐列压实） */
  for(let c = 0; c < COLS; c++){
    let write = ROWS - 1;
    for(let r = ROWS - 1; r >= 0; r--){
      const t = G.grid[r][c];
      if(t){
        if(write !== r){
          G.grid[write][c] = t;
          G.grid[r][c] = null;
          t.r = write; t.state = 'fall'; t.vy = 0;
        }
        write--;
      }
    }
    for(let r = write; r >= 0; r--){
      const t = decorateFruit(makeTile(randType(), r, c));
      t.y = rowY(r) - (write + 1.35) * TILE - Math.random() * TILE * 0.5;
      t.state = 'fall'; t.vy = 0;
      G.grid[r][c] = t;
    }
  }
  G.phase = 'fall';
}

   - 天气有意图也有克制：雨优先浇订单缺的水果并解冻；风专挑能成消除的行；寒潮专冻快连上的水果
   ========================================================= */
const WEATHER = {

function refillWxQueue(){
  const pool = cfg().weatherPool || [];
  const q = pool.slice();
  for(let i = q.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = q[i]; q[i] = q[j]; q[j] = tmp;
  }
  /* 避免和刚触发过的天气首尾相连 */
  if(G.forecast && q.length > 1 && q[0] === G.forecast){
    const j = 1 + Math.floor(Math.random() * (q.length - 1));
    const tmp = q[0]; q[0] = q[j]; q[j] = tmp;
  }
  G.wxQueue.push(...q);
}
function nextForecast(){
  if(!G.wxQueue.length) refillWxQueue();
  return G.wxQueue.shift();
}

/* 加权抽格子（订单缺的水果 / 快连上的热点，权重更高） */
function pickWeighted(pool){
  let total = 0;
  for(const p of pool) total += p.w;
  let x = Math.random() * total;
  for(let i = 0; i < pool.length; i++){
    x -= pool[i].w;
    if(x <= 0) return i;
  }
  return pool.length - 1;
}

function buildWeatherPlan(name){
  if(!name)return null;
  if(name==='wind')return {name,rows:windRows(2),cells:[]};
  const pool=[];
  forEachCell((t,r,c)=>{
    if(t.type>=0&&!t.special&&!t.boost&&!t.frost)pool.push({r,c,w:(orderFor(t.type)?2:1)});
  });
  const cells=[],limit=name==='rain'?6:3;
  while(cells.length<limit&&pool.length)cells.push(pool.splice(pickWeighted(pool),1)[0]);
  return {name,rows:[],cells:cells.map(({r,c})=>({r,c}))};
}
function ensureWeatherPlan(){
  if(!G.forecast){G.weatherPlan=null;return null;}
  if(!G.weatherPlan||G.weatherPlan.name!==G.forecast)G.weatherPlan=buildWeatherPlan(G.forecast);
  return G.weatherPlan;
}
function plannedTargets(plan,blessed=G.wxArmed){
  if(!plan)return [];
  return plan.name==='wind'?plan.rows.slice(0,blessed?2:1):plan.cells.slice(0,plan.name==='rain'?(blessed?6:4):(blessed?1:3));
}
function drawWeatherPlan(){
  if(G.state!=='play'||G.phase!=='idle')return;
  const plan=ensureWeatherPlan();if(!plan)return;
  ctx.save();ctx.lineWidth=1.5;
  const color=plan.name==='rain'?'#709e9e':plan.name==='frost'?'#829fc9':'#93a274';
  ctx.strokeStyle=color;ctx.fillStyle=color;
  if(plan.name==='wind'){
    for(const r of plannedTargets(plan)){
      ctx.setLineDash([4,5]);rr(BX+1,BY+r*TILE+1,COLS*TILE-2,TILE-2,12);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(BX+8,rowY(r));ctx.lineTo(BX+17,rowY(r)-5);ctx.lineTo(BX+17,rowY(r)+5);ctx.closePath();ctx.fill();
    }
  }else for(const {r,c}of plannedTargets(plan)){
    ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(colX(c),rowY(r),TILE*.44,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    const x=colX(c)-TILE*.32,y=rowY(r)+TILE*.32;
    ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#fffef8';ctx.fill();ctx.stroke();
    ctx.fillStyle=color;ctx.font='800 8px '+UI_FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(plan.name==='rain'?'雨':'冰',x,y);
  }
  ctx.restore();
}

function maybeWeather(){
  const c = cfg();
  if(!c.weatherEvery || !c.weatherPool || !c.weatherPool.length) return false;
  if(G.weatherLeft > 1){
    G.weatherLeft--;
    if(!prog().seenWeatherIntro){
      showLesson('forecast','play','weather-intro','天气每走一步，就近一步');
    }else if(G.weatherLeft===1 && !prog().seenWeatherGuide.includes(G.forecast)){
      showLesson(G.forecast,'play','weather-before','下一步：'+WEATHER[G.forecast].name);
    }
    return false;
  }
  G.weatherLeft = c.weatherEvery;
  const name = G.forecast || nextForecast();
  const plan=ensureWeatherPlan();
  G.forecast = nextForecast(); G.weatherPlan=null;
  const blessed = G.wxArmed;   /* 长链蓄力：天气变温和版 */
  G.wxArmed = false;
  return triggerWeather(name, blessed, plan);
}

function triggerWeather(name, blessed, plan){
  plan=plan&&plan.name===name?plan:buildWeatherPlan(name);
  if(name === 'rain'){
    /* ☔ 阵雨：随机水果变 ✨ 双倍（订单也×2），优先浇订单还缺的；雨水顺带解冻。甘霖(✨)浇 6 个 */
    const n = blessed ? 6 : 4;
    let affected=0;
    for(const {r,c}of plannedTargets(plan,blessed)){
      const t=G.grid[r][c];if(!t||t.type<0||t.special)continue;
      t.boost=1;t.bornT=.3;affected++;
      burst(colX(c),rowY(r),'#ffd166',4);
    }
    let thawed = 0;
    forEachCell((t) => { if(t.frost){ t.frost = 0; t.bornT = 0.25; thawed++; } });
    announceWeather('rain', blessed, '滋润 ' + affected + ' 个 ×2' + (thawed ? ' · 解冻 ×' + thawed : ''));
    sfxRain();
    G.wfx = {name:'rain', t:blessed ? 2.8 : 2.0, blessed};
  }else if(name === 'wind'){
    /* 🌬️ 起风：优先挑"吹完立刻成消除"的行；顺风格(✨)连吹两行 */
    const rows = plannedTargets(plan,blessed);
    for(const row of rows) windShiftRow(row);
    announceWeather('wind', blessed, '吹动 ' + rows.map(r => '第' + (r + 1) + '行').join('、'));
    sfxWind();
    G.wfx = {name:'wind', t:blessed ? 1.9 : 1.3, row:rows[0], blessed};
    G.combo = 1;
    G.flashT = 0.18;
    nextCascadeStep(true);
    return true;
  }else if(name === 'frost'){
    /* ❄️ 寒潮：优先冻"快连上的水果"（堵你的路线）；瑞雪(✨)只冻 1 个 */
    const n = blessed ? 1 : 3;
    let frozen=0;

       之后 → 画布公告卡（约 4s 自动消失，不挡操作，没看清可点预报芯片查图鉴）

function announceWeather(name, blessed, detail){
  const wd = WEATHER[name];
  if(!wd) return;
  const title = blessed ? '✨ ' + wd.gentle + ' · 温和版' : wd.icon + ' ' + wd.name;

  }

  else G.wxCard = {name, blessed, title, detail, hint:wd.hint, t:0, dur:4.2};
}

function rowShiftMatch(r){
  const row = G.grid[r];
  const nw = [];
  for(let c = 0; c < COLS; c++) nw.push(row[(c + 1) % COLS]);
  for(let c = 0; c + 2 < COLS; c++){
    const a = nw[c], b = nw[c + 1], d = nw[c + 2];
    if(a && b && d && a.type >= 0 && a.type === b.type && b.type === d.type) return true;
  }
  for(let c = 0; c < COLS; c++){
    const t = nw[c];
    if(!t || t.type < 0) continue;
    for(let dir = -1; dir <= 1; dir += 2){
      const r1 = r + dir, r2 = r + dir * 2;
      if(r1 < 0 || r1 >= ROWS || r2 < 0 || r2 >= ROWS) continue;
      const t1 = G.grid[r1][c], t2 = G.grid[r2][c];
      if(t1 && t2 && t1.type === t.type && t2.type === t.type) return true;
    }
    /* 中位竖三连：位移后的牌恰好落在中间（上下各一个同款） */
    if(r > 0 && r < ROWS - 1){
      const up = G.grid[r - 1][c], dn = G.grid[r + 1][c];
      if(up && dn && up.type >= 0 && up.type === t.type && dn.type === t.type) return true;
    }
  }
  return false;
}
function windRows(k){
  let smart = [];
  for(let r = 0; r < ROWS; r++) if(rowShiftMatch(r)) smart.push(r);
  const rows = [];
  let guard = 0;
  while(rows.length < k && guard++ < 32){
    let r;
    if(smart.length){
      r = smart[Math.floor(Math.random() * smart.length)];
      smart = smart.filter(x => x !== r);
    }else{
      r = Math.floor(Math.random() * ROWS);
    }
    if(!rows.includes(r)) rows.push(r);
  }
  return rows;
}
function windShiftRow(row){
  const tiles = G.grid[row];
  const moved = tiles[0];
  for(let c = 0; c < COLS - 1; c++) tiles[c] = tiles[c + 1];
  tiles[COLS - 1] = moved;
  for(let c = 0; c < COLS; c++){
    const t = tiles[c];
    if(t){ t.c = c; t.x = colX(c); t.y = rowY(row); t.squashT = 0.14; }
  }
}

function nextCascadeStep(skipWx){
  // One rotation per manual turn; cascades and pocket tools never rotate again.
  if(G.colorPending)cycleFruits();
  const groups = findMatches();
  if(groups.length){
    G.combo++;
    G.maxCombo = Math.max(G.maxCombo, G.combo);
    const seeds = processMatchGroups(groups);
    if(startRemoval(seeds)) return;
  }
  if(allGoalsDone()){
    if(G.bonus){
      if(G.bonusLeft > 0){ G.phase = 'bonus'; G.bonusT = 0.32; return; }
      winNow(); return;
    }
    if(G.moves > 0){
      G.bonus = true;
      G.bonusLeft = Math.min(G.moves, 6);
      if(G.moves > G.bonusLeft){
        const extra = (G.moves - G.bonusLeft) * 60;
        addScore(extra, {x: W / 2, y: BY + ROWS * TILE * 0.45, label:'剩余步数 +' + extra});
      }
      banner('🎉 订单完成！剩余步数变炸弹');
      G.phase = 'bonus'; G.bonusT = 0.55;
      return;
    }
    winNow(); return;
  }
  if(G.moves <= 0){ loseNow(); return; }
  if(!skipWx && G.weatherPending){
    G.weatherPending=false;
    if(maybeWeather() && (G.phase === 'pop' || G.phase === 'fall' || G.phase === 'bonus')) return;
  }
  if(!hasAnyMove()){ shuffleBoard(); return; }
  G.phase = 'idle';
  ensureWeatherPlan();
  G.hintT = 0; G.hint = null;
  saveRun();
}

function injectBonusBomb(){
  /* 彩虹格不能被覆盖（type=-1），优先落在普通水果上 */
  const plain = [], any = [];
  forEachCell((t, r, c) => {
    if(t.spawnKeep || t.frost || t.special === 'rainbow') return;
    (t.special ? any : plain).push({r, c});
  });

  if(!cand.length){ G.bonusLeft = 0; return; }

/* =========================================================
   11. 画线流程
   ========================================================= */
function extendPath(cell){
  const path = G.path;
  const last = path[path.length - 1];
  if(!last) return;
  if(cell.r === last.r && cell.c === last.c) return;
  /* 划回上一格 = 回退一步 */
  if(path.length >= 2){
    const prev = path[path.length - 2];
    if(cell.r === prev.r && cell.c === prev.c){ path.pop(); blip(500, 0.04, 'sine', 0.03); return; }
  }
  if(pathIsLoop(path)) return;
  if(Math.abs(cell.r - last.r) > 1 || Math.abs(cell.c - last.c) > 1) return;
  const t = G.grid[cell.r][cell.c], lt = G.grid[last.r][last.c];
  if(!t || !lt || t.frost || t.type !== lt.type) return;
  const closing = cell.r === path[0].r && cell.c === path[0].c;
  if(closing && !canCloseLoop(path)) return;
  if(!closing && path.some(x => x.r === cell.r && x.c === cell.c)) return;
  /* 不接受斜线交叉；闭合边仅允许与首边共用起点。 */
  for(let i = 0; i < path.length - 2; i++){
    if(closing && i === 0) continue;
    if(segmentsCross(last, cell, path[i], path[i + 1])) return;
  }
  if(closing && Math.abs(pathArea(path)) < 0.5) return;
  path.push(cell);
  blip(560 + Math.min(path.length, 10) * 40, 0.045, 'triangle', 0.035);
}

function segmentsCross(a, b, c, d){
  const side = (p, q, r) => (q.c-p.c)*(r.r-p.r)-(q.r-p.r)*(r.c-p.c);
  return side(a,b,c)*side(a,b,d) < 0 && side(c,d,a)*side(c,d,b) < 0;
}
function pathArea(p){
  let area = 0;
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length];
    area += a.c*b.r-b.c*a.r;
  }
  return area/2;
}
function pathIsLoop(p){
  if(p.length < 5) return false;
  const a = p[0], b = p[p.length - 1];
  return a.r === b.r && a.c === b.c && Math.abs(pathArea(p)) >= 0.5;
}
/* One readiness rule for the start ring, HUD, hints and actual closure. */
function canCloseLoop(p){
  if(!cfg().loop || p.length<4 || pathIsLoop(p))return false;
  const first=p[0],last=p[p.length-1];
  if(Math.max(Math.abs(first.r-last.r),Math.abs(first.c-last.c))!==1)return false;
  const a=G.grid[first.r]?.[first.c],b=G.grid[last.r]?.[last.c];
  if(!a||!b||a.frost||b.frost||a.type<0||a.type!==b.type)return false;
  for(let i=1;i<p.length-2;i++)if(segmentsCross(last,first,p[i],p[i+1]))return false;
  return Math.abs(pathArea(p))>=.5;
}
function pathLength(p){ return p.length - (pathIsLoop(p) ? 1 : 0); }

/* Only the player's unique linked fruit count earns a cheer, never automatic clears. */
function chainPraise(n){
  if(n>=12)return {word:'Perfect!',color:'#d99645',tier:4};

  if(n>=6)return {word:'Great!',color:'#8d83bb',tier:2};
  if(n>=4)return {word:'Good!',color:'#579785',tier:1};
  return null;
}
function cheerChain(p){
  const n=pathLength(p),praise=chainPraise(n);
  if(!praise)return;
  G.cheer={...praise,n,t:0,dur:1.35};
  burst(W/2,BY+ROWS*TILE*.48,praise.color,4+praise.tier*3);

}

/* 只预测当前操作可确定的结果，不把未知补牌连锁计入。 */
function pathPreview(p){
  if(!p.length) return null;
  const first = G.grid[p[0].r][p[0].c];
  const n = pathLength(p), loop = cfg().loop && pathIsLoop(p);
  if(first.special === 'rainbow' && n === 1){
    return {n, loop, reward:'rainbowTap', marked:planRemovals([p[0]])};
  }
  const reward = loop ? 'loop' : n >= 8 && cfg().rainbow ? 'rainbow' : n >= 6 && cfg().bomb ? 'bomb' : null;
  let seeds = p.slice();
  if(loop) forEachCell((t,r,c)=>{ if(t.type===first.type) seeds.push({r,c}); });
  if(reward === 'bomb' || reward === 'rainbow') seeds = seeds.slice(1);
  const keep = reward === 'bomb' || reward === 'rainbow' ? new Set([key(p[0].r,p[0].c)]) : null;
  const marked = n >= 3 ? planRemovals(seeds.concat(beeTargets(p)), null, keep) : new Set();
  /* 起点将变成新道具，本次保留，与实际消除的 spawnKeep 一致。 */
  if(reward === 'bomb' || reward === 'rainbow') marked.delete(key(p[0].r,p[0].c));
  return {n, loop, reward, marked};
}

function commitPath(){

  if(!p.length) return;
  if(p.length === 1){
    const t = G.grid[p[0].r] && G.grid[p[0].r][p[0].c];
    if(t && t.special === 'rainbow') activateRainbow(p[0]);
    return;
  }
  if(p.length < 3){ blip(220, 0.07, 'square', 0.03); return; }
  finishPath(p);
}

function activateRainbow(cell){

function finishPath(p){
  const a = p[0];
  const t0 = G.grid[a.r][a.c];
  if(!t0 || t0.type < 0) return;
  const loop = cfg().loop && pathIsLoop(p);
  G.moves--; updateMoves();G.weatherPending=true;
  G.colorPending=!!cfg().orchard?.cycle;
  G.combo = 1; G.autoMade=0;

    blip(860, 0.1, 'triangle', 0.04, 120);
  }

  const seeds = p.slice();
  if(loop){
    /* ⭕ 成圈：清除全场同款 */
    const tp = t0.type;
    forEachCell((t, r, c) => { if(t.type === tp) seeds.push({r, c}); });

    G.flashT = 0.25;
    addScore(150, {x:colX(a.c), y:rowY(a.r), label:'⭕ 成圈 +150'});
  }else if(p.length >= 8 && cfg().rainbow){
    /* 8 连及以上：起点生成 🌈 彩虹 */

    G.stats.rainbowMade++;
    addScore(200, {x:colX(a.c), y:rowY(a.r), label:'🌈 彩虹 +200'});
    sfxSpawn();
    updateOrders();
  }else if(p.length >= 6 && cfg().bomb){
    /* 6~7 连：起点生成 💥 炸弹 */
    t0.special = 'bomb'; t0.spawnKeep = true; t0.bornT = 0.35;
    G.stats.bombMade++;
    addScore(100, {x:colX(a.c), y:rowY(a.r), label:'💥 炸弹 +100'});
    sfxSpawn();
    updateOrders();
  }
  const bee=chargeBee(p);seeds.push(...bee);
  if(startRemoval(seeds)){
    cheerChain(p);
    if(G.teachBasics){
      G.teachBasics=false; prog().seenBasics=true; persist();
      banner('采摘成功！继续完成上方订单');
    }
    if(!loop && p.length >= 5){
      const bonus = (p.length - 4) * 20;
      addScore(bonus, {x:colX(a.c), y:rowY(a.r) - TILE * 0.6, label:'长链 +' + bonus});
    }
  }
}

function startLevel(idx,restored=null){
  if(idx < 0 || idx >= LEVEL_N) idx = 0;
  const c = LEVELS[idx];
  G.level = idx;
  G.state = 'play';G.screen=null;
  G.types = c.types;G.lessonRoute=null;G.tools=toolAllowance(c);G.toolUses={scissors:0,glove:0,basket:0};cancelTool();
  G.orchard=freshOrchard(c);G.colorPending=false;G.beeFlights=[];
  G.moves = c.moves;
  G.score = 0;
  G.combo = 0; G.maxCombo = 0; G.autoMade=0;
  G.stats = {bombMade:0, rainbowMade:0};

    ? {kind:'fruit', fruit:g.fruit, n:g.n, got:0, done:false}
    : g.feature ? {kind:'feature',feature:g.feature,n:g.n} : g.tool ? {kind:'tool',tool:g.tool,n:g.n} : {kind:'special', special:g.special, n:g.n});
  clearGesture(); G.lastSwap = null;

  G.hint = null; G.hintT = 0;

  G.marked = new Set();
  G.parts = []; G.texts = []; G.banner = null; G.cheer=null; G.slices=[];G.cutTrails=[];
  G.shake = 0; G.flashT = 0; G.shuffleT = 0;
  if(restored){
    G.grid=restored.grid.map((row,r)=>row.map((t,c)=>Object.assign(makeTile(t.type,r,c,t.special),{frost:t.frost,boost:t.boost})));
    G.tools={...restored.tools};G.toolUses={...restored.toolUses};
    G.orchard={...restored.orchard,flowers:restored.orchard.flowers.slice()};
    G.moves=restored.moves;G.score=restored.score;G.maxCombo=restored.maxCombo;G.stats={...restored.stats};
    G.orders.forEach((o,i)=>{if(o.kind==='fruit'){o.got=restored.collected[i];o.done=o.got>=o.n;}});
    G.weatherLeft=restored.weatherLeft;G.forecast=restored.forecast;G.wxQueue=restored.wxQueue.slice();
    G.wxArmed=restored.wxArmed;G.weatherPlan=restored.weatherPlan;G.teachBasics=restored.teachBasics;G.lessonRoute=restored.lessonRoute;
    G.phase='idle';applyThemeVars();setLevelHUD();updateOrders();updateMoves();hideOverlay();saveRun();
    if(c.introTool&&!prog().seenTools.includes(c.introTool))showLesson(c.introTool,'play','tool-intro','随身道具 · 不扣步数');
    else teachOrchard(c);return;
  }
  fillBoard();
  G.teachBasics = idx===0 && !prog().seenBasics;
  if(G.teachBasics){
    for(const p of [{r:3,c:2},{r:4,c:3},{r:5,c:4}]) G.grid[p.r][p.c]=makeTile(0,p.r,p.c);
  }
  if(idx===3)G.lessonRoute=Array.from({length:6},(_,i)=>({r:3,c:i+1}));
  if(idx===4)G.lessonRoute=[[2,1],[2,2],[2,3],[2,4],[2,5],[3,5],[3,4],[3,3]].map(([r,c])=>({r,c}));
  if(idx===5)G.lessonRoute=[[3,3],[3,4],[4,4],[4,3]].map(([r,c])=>({r,c}));
  if(G.lessonRoute)for(const {r,c}of G.lessonRoute)G.grid[r][c]=makeTile(idx===3?0:idx===4?1:3,r,c);
  if(idx===15){G.grid[3][3].frost=1;}
  if(idx===17){
    for(let col=1;col<=5;col++)G.grid[3][col]=makeTile(0,3,col);
    G.grid[3][6]=makeTile(1,3,6);G.grid[2][6]=makeTile(0,2,6);
  }
  if(idx===19)for(let r=2;r<=4;r++)for(let col=2;col<=4;col++){G.grid[r][col]=makeTile((r+col)%2,r,col);if(r===3)G.grid[r][col].frost=1;}
  if(idx===30){G.lessonRoute=[{r:2,c:1},{r:3,c:2},{r:4,c:3}];for(const p of G.lessonRoute)G.grid[p.r][p.c]=makeTile(0,p.r,p.c);}
  if(c.orchard?.burst)for(const [r,col]of [[2,2],[4,5],[6,3]]){G.grid[r][col].special='burst';G.grid[r][col].type=idx===35?0:G.grid[r][col].type;}
  if(c.orchard?.cycle)for(const [r,col]of [[1,2],[3,4],[5,6],[6,1]])G.grid[r][col].special='cycle';
  if(idx===35){G.lessonRoute=[{r:2,c:1},{r:2,c:2},{r:2,c:3}];for(const p of G.lessonRoute)G.grid[p.r][p.c]=makeTile(0,p.r,p.c,p.c===2?'burst':null);}
  if(idx===40){G.lessonRoute=[{r:3,c:3},{r:3,c:4},{r:4,c:5}];for(const p of G.lessonRoute)G.grid[p.r][p.c]=makeTile(1,p.r,p.c,p.c===4?'cycle':null);}
  if(idx===45){G.lessonRoute=[{r:2,c:1},{r:3,c:2},{r:4,c:3},{r:5,c:4}];for(const p of G.lessonRoute)G.grid[p.r][p.c]=makeTile(0,p.r,p.c);}
  ensureWeatherPlan();
  G.phase='idle';saveRun();
  /* 开场瀑布落牌 */
  forEachCell((t) => {
    t.y = rowY(t.r) - (ROWS - t.r) * TILE - TILE * 1.4 - (t.c % 4) * TILE * 0.35 - Math.random() * 40;
    t.state = 'fall'; t.vy = 0;
  });
  G.phase = 'fallin';
  applyThemeVars();
  setLevelHUD();
  updateOrders(true);
  updateMoves();
  hideOverlay();
  if(c.introTool&&!prog().seenTools.includes(c.introTool))showLesson(c.introTool,'play','tool-intro','随身道具 · 不扣步数');
  else teachOrchard(c);
}

function starsFor(score){
  const c = cfg();
  return score >= c.star3 ? 3 : (score >= c.star2 ? 2 : 1);
}
function winNow(){
  clearSavedRun();
  G.state = 'win';
  const s = starsFor(G.score);
  const pr = prog();
  const prevBest = pr.best[G.level] || 0;
  pr.best[G.level] = Math.max(prevBest, G.score);
  pr.stars[G.level] = Math.max(pr.stars[G.level] || 0, s);
  pr.unlocked = Math.max(pr.unlocked, Math.min(LEVEL_N, G.level + 2));
  persist();
  sfxWin();
  confettiBurst();
  showWin(s, G.score > prevBest && prevBest > 0);
}
function loseNow(){
  clearSavedRun();
  G.state = 'lose';
  sfxLose();
  showLose();
}

function updateFx(dt){
  if(G.state==='paused')return;
  for(const p of G.beeFlights)p.t+=dt;
  G.beeFlights=G.beeFlights.filter(p=>p.t<p.life);
  for(const p of G.slices){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.rot+=p.vr*dt;}
  G.slices=G.slices.filter(p=>p.t<p.life);
  for(const p of G.cutTrails)p.t+=dt;
  G.cutTrails=G.cutTrails.filter(p=>p.t<p.life);
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.2);
  if(G.flashT > 0) G.flashT = Math.max(0, G.flashT - dt);
  if(G.shuffleT > 0) G.shuffleT = Math.max(0, G.shuffleT - dt);
  /* 天气氛围粒子（温和版更热闹） */
  if(G.wfx){
    G.wfx.t -= dt;
    if(G.wfx.name === 'rain'){
      const n = G.wfx.blessed ? 5 : 3;
      for(let i = 0; i < n; i++) G.wparts.push({x:Math.random() * W, y:-12, vy:420 + Math.random() * 180});
      for(const d of G.wparts) d.y += d.vy * dt;
      G.wparts = G.wparts.filter(d => d.y < H + 16);
    }else if(G.wfx.name === 'frost'){
      const cap = G.wfx.blessed ? 34 : 60, n = G.wfx.blessed ? 1 : 2;
      if(G.wparts.length < cap){
        for(let i = 0; i < n; i++) G.wparts.push({x:Math.random() * W, y:-8, vy:55 + Math.random() * 55,
          r:1.6 + Math.random() * 2.6, drift:(Math.random() - 0.5) * 40});
      }
      for(const d of G.wparts){ d.y += d.vy * dt; d.x += d.drift * dt; }
      G.wparts = G.wparts.filter(d => d.y < H + 8);
    }else if(G.wfx.name === 'wind'){
      if(G.wparts.length < (G.wfx.blessed ? 22 : 12)) G.wparts.push({x:W + 20, y:BY + G.wfx.row * TILE + Math.random() * TILE,
        vx:-(420 + Math.random() * 320), len:26 + Math.random() * 54});
      for(const d of G.wparts) d.x += d.vx * dt;
      G.wparts = G.wparts.filter(d => d.x + d.len > -10);
    }
    if(G.wfx.t <= 0){ G.wfx = null; G.wparts = []; }
  }
  if(G.banner){ G.banner.t += dt; if(G.banner.t >= G.banner.dur) G.banner = null; }
  if(G.cheer){ G.cheer.t += dt; if(G.cheer.t >= G.cheer.dur) G.cheer = null; }
  if(G.wxCard){ G.wxCard.t += dt; if(G.wxCard.t >= G.wxCard.dur) G.wxCard = null; }
  for(const p of G.parts){
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 430 * dt;
    if(p.vr) p.rot += p.vr * dt;
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  for(const t of G.texts){ t.t += dt; t.y -= 32 * dt; }
  G.texts = G.texts.filter(t => t.t < t.life);
}

/* =========================================================
   15. 更新
   ========================================================= */
function allSettled(){
  for(let r = 0; r < ROWS; r++){
    const row = G.grid[r]; if(!row) continue;
    for(let c = 0; c < COLS; c++){
      const t = row[c];
      if(t && t.state !== 'idle') return false;
    }
  }
  return true;
}
function updateTiles(dt){
  for(let r = 0; r < ROWS; r++){
    const row = G.grid[r]; if(!row) continue;
    for(let c = 0; c < COLS; c++){
      const t = row[c]; if(!t) continue;
      if(t.state === 'fall'){
        t.vy = Math.min(1500, t.vy + 3400 * dt);
        t.y += t.vy * dt;
        const ty = rowY(t.r);
        if(t.y >= ty){ t.y = ty; t.vy = 0; t.state = 'idle'; t.squashT = 0.14; }
        t.x = colX(t.c);
      }else if(t.state === 'idle'){
        t.x = colX(t.c); t.y = rowY(t.r);
      }else if(t.state === 'pop'){
        t.popT += dt;
      }
      if(t.squashT > 0) t.squashT = Math.max(0, t.squashT - dt);
      if(t.bornT > 0) t.bornT = Math.max(0, t.bornT - dt);
    }
  }
}
function update(dt){
  updateFx(dt);
  if(G.state !== 'play') return;
  switch(G.phase){
    case 'fallin':
      if(allSettled()){
        G.phase = 'idle'; G.hintT = 0;
        if(G.teachBasics) G.hint={cells:[{r:3,c:2},{r:4,c:3},{r:5,c:4}]};
      }
      break;
    case 'pop':
      G.popT -= dt;
      if(G.popT <= 0) applyRemovals();
      break;
    case 'fall':
      if(allSettled()) nextCascadeStep();
      break;
    case 'bonus':
      G.bonusT -= dt;
      if(G.bonusT <= 0){
        if(G.bonusLeft > 0){ G.bonusLeft--; injectBonusBomb(); }
        else winNow();
      }
      break;
    case 'idle':
      if(G.activeTool){G.hintT=0;G.hint=null;break;}
      if(G.orders.some(o=>o.kind==='tool'&&orderGot(o)<o.n)){G.hintT=0;G.hint=null;break;}
      G.hintT += dt;
      if(G.hintT > 5 && !G.hint) G.hint = findHint();
      break;
  }
  updateTiles(dt);
}

function drawTile(t){
  if(t.state==='pop')return;
  let scale=1,sy=1;
  if(t.squashT>0)sy=.9+.1*(1-t.squashT/.14);
  if(t.bornT>0)scale*=1+.15*(t.bornT/.35);
  const inPath=G._pk&&G._pk.has(key(t.r,t.c));
  if(inPath)scale*=1.06;
  const s=TILE*.92;
  ctx.save();ctx.globalAlpha=G.path.length && !inPath ? .94 : 1;
  ctx.translate(t.x,t.y+(inPath?-2:0));ctx.scale(scale,scale*sy);
  if(inPath||t.boost){
    ctx.beginPath();ctx.ellipse(0,s*.06,s*.47,s*.43,0,0,Math.PI*2);
    ctx.fillStyle=inPath?'#deefe4':'#fff1c2';ctx.fill();
    ctx.strokeStyle=inPath?'#80b298':'#e4be62';ctx.lineWidth=1.6;ctx.stroke();
  }
  if(t.frost)drawIceShell(s);
  if(t.special==='rainbow')drawRainbowCard(s);else{
    window.FruitArt.draw(ctx,t.type,s,{selected:!!inPath});
    if(t.frost)drawIceShell(s,true);
  }
  if(t.boost)drawStatusBadge(s,'rain');
  if(t.frost)drawStatusBadge(s,'frost');
  if(t.special==='bomb')drawStatusBadge(s,'bomb');
  if(t.special==='burst'||t.special==='cycle')drawOrchardBadge(s,t.special,t.type);
  if(inPath){
    const index=G.path.findIndex(p=>p.r===t.r&&p.c===t.c)+1,x=-s*.34,y=-s*.32,r=Math.max(7,s*.16);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='#47745f';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+Math.max(10,s*.25)+'px '+UI_FONT;ctx.fillText(String(index),x,y);
  }
