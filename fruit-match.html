}
function sliceFruit(t){
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){burst(t.x,t.y,FRUITS[t.type].c2,2);return;}
  for(const side of [-1,1])G.slices.push({
    type:t.type,side,x:t.x,y:t.y,vx:side*(35+Math.random()*30),vy:-65-Math.random()*45,
    size:TILE*.92,t:0,life:.58,rot:0,vr:side*(.8+Math.random()*.7)
  });
}
function drawSliceFx(){
  for(const trail of G.cutTrails){
    if(trail.points.length<2)continue;
    ctx.save();ctx.globalAlpha=Math.max(0,1-trail.t/trail.life);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();trail.points.forEach((p,i)=>{if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y);});
    ctx.strokeStyle='#a4d7c5';ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle='#fffef1';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  }
  for(const p of G.slices){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=p.t/p.life<.6?1:Math.max(0,(1-p.t/p.life)/.4);
    window.FruitArt.half(ctx,p.type,p.size,p.side);ctx.restore();
  }
}

function drawBoard(){
  const th = theme();
  const hint = G.activeTool ? null : G.teachBasics && !G.path.length
    ? {cells:[{r:3,c:2},{r:4,c:3},{r:5,c:4}]} : G.lessonRoute&&!G.path.length ? {cells:G.lessonRoute} : G.hint;
  const pad = TILE * 0.22;
  const g = ctx.createLinearGradient(0, BY - pad, 0, BY + ROWS * TILE + pad);
  g.addColorStop(0, th.panelA); g.addColorStop(1, th.panelB);
  ctx.save();
  ctx.shadowColor = 'rgba(140,110,170,.16)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = g;
  rr(BX - pad, BY - pad, COLS * TILE + pad * 2, ROWS * TILE + pad * 2, 20); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = th.panelBorder; ctx.lineWidth = 1.5;
  rr(BX - pad, BY - pad, COLS * TILE + pad * 2, ROWS * TILE + pad * 2, 20); ctx.stroke();
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    ctx.fillStyle = ((r + c) % 2 === 0) ? th.cell1 : th.cell2;
    rr(BX + c * TILE + 1.5, BY + r * TILE + 1.5, TILE - 3, TILE - 3, TILE * 0.2); ctx.fill();
  }
  if(hint && G.phase === 'idle' && !G.path.length){
    const pul = 0.5 + 0.5 * Math.sin(nowMs * 0.006);
    ctx.save();
    ctx.strokeStyle = 'rgba(105,160,130,' + (0.45 + 0.35 * pul).toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    hint.cells.forEach((cell,i)=>{ if(i) ctx.lineTo(colX(cell.c),rowY(cell.r)); else ctx.moveTo(colX(cell.c),rowY(cell.r)); });
    ctx.stroke();
    for(const cell of hint.cells){
      ctx.beginPath();ctx.arc(colX(cell.c),rowY(cell.r),TILE*.46,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
  drawFlowerGround(false);
  G._pk = new Set(G.path.map(p => key(p.r, p.c)));
  for(let r = 0; r < ROWS; r++){
    const row = G.grid[r]; if(!row) continue;
    for(let c = 0; c < COLS; c++){
      const t = row[c]; if(!t) continue;
      drawTile(t);
    }
  }
  if(hint && G.phase==='idle' && !G.path.length){
    ctx.save();
    for(let i=0;i<hint.cells.length;i++){
      if(i===hint.cells.length-1&&i>0&&hint.cells[i].r===hint.cells[0].r&&hint.cells[i].c===hint.cells[0].c)continue;
      const p=hint.cells[i], x=colX(p.c)-TILE*.28, y=rowY(p.r)-TILE*.28;
      ctx.beginPath();ctx.arc(x,y,Math.max(8,TILE*.17),0,Math.PI*2);
      ctx.fillStyle='#f8fbed';ctx.fill();ctx.strokeStyle='#88ac77';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#5d7e51';ctx.font='900 '+Math.max(10,TILE*.24)+'px '+UI_FONT;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x,y);
    }
    ctx.restore();
  }
}
function drawPath(){
  const p = G.path;
  if(p.length < 2) return;
  const first = G.grid[p[0].r][p[0].c];
  const ac = first && first.type >= 0 ? FRUITS[first.type].bd : theme().ac2;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(colX(p[0].c), rowY(p[0].r));
  for(let i = 1; i < p.length; i++) ctx.lineTo(colX(p[i].c), rowY(p[i].r));
  ctx.strokeStyle = ac; ctx.globalAlpha = 0.4; ctx.lineWidth = TILE * 0.24;
  ctx.shadowColor = ac; ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.globalAlpha = 0.9; ctx.lineWidth = TILE * 0.09;
  ctx.stroke();
  const e = p[p.length - 1];
  ctx.globalAlpha = 0.95; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(colX(e.c), rowY(e.r), TILE * 0.13, 0, Math.PI * 2); ctx.fill();
  /* 靠近起点时提示闭环；完成后保留明确的闭合线。 */
  if((cfg().loop&&pathIsLoop(p)) || canCloseLoop(p)){
    const pul = 0.5 + 0.5 * Math.sin(nowMs * 0.02);
    ctx.strokeStyle = 'rgba(255,205,60,' + (0.45 + 0.55 * pul).toFixed(2) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(colX(p[0].c), rowY(p[0].r), TILE * 0.55, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function drawWeatherFx(){
  if(!G.wfx || G.wfx.t <= 0) return;
  /* 天气氛围色罩（随结束淡出） */
  const TINT = {rain:'rgba(96,148,224,.12)', wind:'rgba(255,236,200,.09)', frost:'rgba(150,200,240,.16)'};
  ctx.save();
  ctx.globalAlpha = Math.min(1, G.wfx.t / 0.3);
  ctx.fillStyle = TINT[G.wfx.name] || 'rgba(255,255,255,0)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  if(!G.wparts.length) return;
  ctx.save();
  if(G.wfx.name === 'rain'){
    ctx.strokeStyle = 'rgba(110,165,230,.5)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for(const d of G.wparts){ ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y + 11); ctx.stroke(); }
  }else if(G.wfx.name === 'frost'){
    ctx.fillStyle = 'rgba(205,232,250,.9)';
    for(const d of G.wparts){ ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }
  }else{
    ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for(const d of G.wparts){ ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.len, d.y); ctx.stroke(); }
  }
  ctx.restore();
}
function drawParticles(){
  for(const p of G.parts){
    const k = p.t / p.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.translate(p.x, p.y);
    if(p.rect){
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
    }else{
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r * (1 - k * 0.4), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}
function drawTexts(){
  for(const t of G.texts){
    const k = t.t / t.life;
    ctx.save();
    ctx.globalAlpha = k < 0.15 ? k / 0.15 : (1 - Math.pow(k, 2.2));
    ctx.fillStyle = t.color;
    ctx.font = '900 ' + t.size + 'px ' + UI_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}
function drawBanner(){
  if(!G.banner) return;
  const b = G.banner;
  const k = b.t / b.dur;
  const scale = 0.7 + 0.3 * Math.min(1, k * 5);
  const alpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, BY + ROWS * TILE * 0.3);
  ctx.scale(scale, scale);
  ctx.font = '900 24px ' + UI_FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.strokeText(b.text, 0, 0);
  ctx.fillStyle = b.color;
  ctx.fillText(b.text, 0, 0);
  ctx.restore();
}
/* 顶部双芯片的几何（分数 + 天气预报）。预报芯片可点击打开天气图鉴，命中检测与绘制共用这一份 */
function scoreChipLayout(){
  ctx.save();
  ctx.font = '800 13px ' + UI_FONT;
  const sl = '分数 ' + G.score;
  const wm = G.forecast ? WEATHER[G.forecast] : null;
  const hasWx = G.state === 'play' && wm && cfg().weatherEvery;
  const urgent = hasWx && G.weatherLeft <= 1;
  const wl = hasWx
    ? (G.wxArmed ? '✨' : '') + wm.icon + wm.name + (urgent ? '将至' : G.weatherLeft + '步后')
    : '';
  const w1 = ctx.measureText(sl).width + 26;
  const w2 = hasWx ? ctx.measureText(wl).width + 40 : 0;   /* 40 = 常规留白 + 右端小问号 */
  const gap = hasWx ? 10 : 0;
  const x0 = W / 2 - (w1 + gap + w2) / 2;
  const y = Math.max(16, BY - TILE * 0.55);
  ctx.restore();
  return {sl, wl, hasWx, urgent, x0, y, w1, w2, gap};
}
function drawScoreChip(){
  if(G.state === 'menu' || G.state === 'intro') return;
  const {sl, wl, hasWx, urgent, x0, y, w1, w2, gap} = scoreChipLayout();
  ctx.save();
  ctx.font = '800 13px ' + UI_FONT;
  /* 布局几何统一由 scoreChipLayout() 提供（点击命中检测共用同一份） */
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  rr(x0, y - 12, w1, 24, 12); ctx.fill();
  ctx.fillStyle = '#8b7c9b';
  ctx.fillText(sl, x0 + w1 / 2, y + 1);
  if(hasWx){
    rr(x0 + w1 + gap, y - 12, w2, 24, 12); ctx.fill();
    if(urgent){
      const pul = 0.5 + 0.5 * Math.sin(nowMs * 0.012);
      ctx.fillStyle = mix('#ff7a5f', '#ff4f6e', pul);
    }else{
      ctx.fillStyle = '#7a6f8f';
    }
    ctx.fillText(wl, x0 + w1 + gap + (w2 - 14) / 2, y + 1);
    /* 右端小问号：点这颗芯片可随时打开天气图鉴 */
    ctx.font = '800 10px ' + UI_FONT;
    ctx.fillStyle = urgent ? 'rgba(255,255,255,.9)' : 'rgba(122,111,143,.8)';
    ctx.fillText('?', x0 + w1 + gap + w2 - 12, y + 1);
  }
  ctx.restore();
}
function fitText(s, maxW, font){
  ctx.font = font;
  if(ctx.measureText(s).width <= maxW) return s;
  let t = s;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
/* 天气公告卡：非首次天气的播报。位于画布底部（芯片下方空间不足），淡入 0.18s、末 0.45s 淡出 */
function drawWxCard(){
  const c = G.wxCard;
  if(!c || G.state !== 'play') return;
  const wd = WEATHER[c.name];
  if(!wd) return;
  const w = Math.min(W - 28, 330), h = 72;
  const aIn = Math.min(1, c.t / 0.18);
  const aOut = c.t > c.dur - 0.45 ? Math.max(0, (c.dur - c.t) / 0.45) : 1;
  const alpha = Math.min(aIn, aOut);
  const x = (W - w) / 2;
  const y = H - h - 12 + (1 - aIn) * 14 + (1 - aOut) * 10;
  const AC = c.name === 'rain' ? '#4a90d9' : c.name === 'wind' ? '#e8a13c' : '#5aa8d8';
  const tx = x + 62, tw = w - 62 - 14;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(255,255,255,.96)';
  rr(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(120,100,150,.14)'; ctx.lineWidth = 1; ctx.stroke();
  /* 左侧色条 + 图标圆底 */
  ctx.fillStyle = AC;
  rr(x, y + 12, 5, h - 24, 3); ctx.fill();
  ctx.save();
  ctx.globalAlpha = alpha * 0.16;
  ctx.beginPath(); ctx.arc(x + 34, y + h / 2, 21, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.font = '21px ' + UI_FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#4c4058';
  ctx.fillText(wd.icon, x + 34, y + h / 2 + 1);
  /* 三行文字：标题 / 刚刚发生了什么 / 应对 */
  ctx.textAlign = 'left';
  ctx.font = '800 14px ' + UI_FONT;
  ctx.fillText(fitText(c.title, tw, '800 14px ' + UI_FONT), tx, y + 18);
  ctx.font = '600 11.5px ' + UI_FONT;
  ctx.fillStyle = '#8b7c9b';
  ctx.fillText(fitText(c.detail, tw, '600 11.5px ' + UI_FONT), tx, y + 37);
  ctx.font = '700 10.5px ' + UI_FONT;
  ctx.fillStyle = AC;
  ctx.fillText(fitText('💡 ' + c.hint, tw, '700 10.5px ' + UI_FONT), tx, y + 56);
  ctx.restore();
}
function draw(){
  if(G.screen && G.state==='menu'){updatePlayHUD();return;}
  ctx.clearRect(0, 0, W, H);
  const th = theme();
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, th.bg[0]); bg.addColorStop(0.55, th.bg[1]); bg.addColorStop(1, th.bg[2]);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if(G.shake > 0){
    const a = G.shake * 7;
    ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
  }
  drawBoard();
  drawFlowerGround(true);
  drawWeatherPlan();drawToolSelection();

  drawSliceFx();

    ctx.save(); ctx.globalAlpha = Math.min(0.35, G.shuffleT * 1.5);

  }
}

let scoreAnimId = 0;
function countUp(el, to, dur){
  cancelAnimationFrame(scoreAnimId);
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = String(Math.round(to * e));
    if(k < 1) scoreAnimId = requestAnimationFrame(step);
  };
  scoreAnimId = requestAnimationFrame(step);
}

    '<div class="big" id="finalScore">0</div>' +
    '<div class="rowline">★★ ' + cfg().star2 + ' 分 · ★★★ ' + cfg().star3 + ' 分 · 最高连锁 ' + Math.max(1, G.maxCombo) + ' 次</div>' +
    '<div class="rowline">手动制作 · 💥 炸弹 ' + G.stats.bombMade + ' · 🌈 彩虹 ' + G.stats.rainbowMade + '</div>' +
    (newBest ? '<div class="newbest">🎉 新纪录！</div>' : '') +
    '<div class="btns">' +
      '<button class="btn" data-act="home">返回</button>' +

function showLose(){
  const missing = G.orders.filter(o => orderGot(o) < o.n).map(o => {
    const label = o.kind === 'fruit' ? fsq(o.fruit) + ' ' + FRUITS[o.fruit].name : o.kind==='feature'?featureIcon(o.feature)+' '+ORCHARD.names[o.feature]:(o.kind==='tool'?toolIcon(o.tool)+' '+TOOL_INFO[o.tool].name:o.special === 'bomb' ? '💥' : '🌈');
    return label + ' 还差 ' + (o.n - orderGot(o));
  }).join('，');
  overlay.innerHTML = '<div class="panel">' +
    '<div class="ribbon bad">步数用完了</div>' +
    '<div class="big">' + G.score + '</div>' +
    '<div class="rowline">★ 完成订单即过关 · ★★ ' + cfg().star2 + ' 分</div>' +
    '<p class="sub">' + (missing ? '订单 ' + missing + '。' : '') + '<br>划长链——6 连出炸弹、8 连出彩虹、画成圈清全场同款！</p>' +
    '<div class="btns">' +
      '<button class="btn" data-act="home">返回</button>' +
      '<button class="btn primary" data-act="retry">再来一次</button>' +
    '</div>' +
  '</div>';
  showOverlay();
}

  if(G.state !== 'play') return;
  const saved=saveRun();clearGesture();

  overlay.innerHTML = '<div class="panel">' +
    '<div class="logo">☕</div>' +
    '<h2>歇一会儿</h2>' +
    '<p class="sub">'+(saved?'当前进度已保存':'这一步尚未结算，返回后从上一步继续')+'</p>'+
    '<p class="sub">第 ' + (G.level + 1) + ' 关' + '<br>分数 ' + G.score + ' · 剩余 ' + G.moves + ' 步</p>' +
    '<div class="btns">' +
      '<button class="btn" data-act="home">退出</button>' +
      '<button class="btn primary" data-act="resume">继续</button>' +

function showWxTeach(name, blessed, detail, title){
  showLesson(name,'play','weather',blessed ? '已蓄力 · '+title : '刚刚遇到'+WEATHER[name].name);
}
function showWxCodex(){
  if(G.state!=='play')return;
  const wd=WEATHER[G.forecast];
  showLesson(wd?G.forecast:'rain','play','forecast',wd ? (G.wxArmed?'已蓄力 · ':'')+wd.name+' · '+G.weatherLeft+'步后' : '看看天气怎么用');
}
function showWeatherClass(){
  if(G.state!=='play'&&G.state!=='menu')return;

function rememberWeatherLesson(){
  const id=lessonView.id;
  if(TOOL_INFO[id]&&!prog().seenTools.includes(id))prog().seenTools.push(id);
  if(ORCHARD.lessons[id]&&!prog().seenOrchard.includes(id))prog().seenOrchard.push(id);
  if(id==='forecast')prog().seenWeatherIntro=true;
  if(['rain','wind','frost'].includes(id)&&!prog().seenWeatherGuide.includes(id))prog().seenWeatherGuide.push(id);
  persist();
}
let helpReturnState='menu';
let lessonView={id:'connect',returnTo:'menu',mode:'help',note:''};
function showHelp(){
  if(G.state!=='play'&&G.state!=='menu')return;
  helpReturnState=G.state;
  showLesson('connect',G.state,'help');
}
function showLesson(id,returnTo=lessonView.returnTo,mode=lessonView.mode,note=lessonView.note){
  const guide=window.FruitGuide;
  if(!guide.lessons[id])id='connect';
  clearGesture();
  G.state=mode==='intro'?'intro':'paused';
  lessonView={id,returnTo,mode,note};
  const l=guide.lessons[id];
  const lockedAt=ORCHARD.lessons[id]?({flowers:31,burst:36,cycle:41,bee:46}[id]):TOOL_INFO[id]?({scissors:16,glove:18,basket:20}[id]):['bomb','blast'].includes(id)?4:['rainbow','tap'].includes(id)?5:0;
  const baseCopy=id==='bee'&&cfg().orchard?.bee?'本关连'+cfg().orchard.bee.chain+'颗起蓄1格，满'+cfg().orchard.bee.charges+'格出发，优先帮收订单。':l.copy;
  const copy=['help','forecast'].includes(mode)&&lockedAt&&G.level+1<lockedAt?'第'+lockedAt+'关解锁 · '+baseCopy:baseCopy;
  const topics=Object.keys(guide.lessons).filter(k=>guide.lessons[k].group===l.group);
  const groupKeys=Object.keys(guide.groups);
  const groups=groupKeys.map(k=>'<button data-act="lesson-group" data-group="'+k+'" aria-pressed="'+(k===l.group)+'">'+guide.groups[k]+'</button>').join('');
  const topicButtons=topics.map(k=>'<button data-act="lesson-topic" data-topic="'+k+'" aria-pressed="'+(id===k)+'">'+guide.lessons[k].label+'</button>').join('');
  const next=topics[(topics.indexOf(id)+1)%topics.length];
  const notice=mode==='feature-intro'||mode==='tool-intro'||mode==='weather'||mode==='weather-before'||mode==='weather-intro';
  const goals=mode==='intro' ? '<div class="lesson-goals"><span>收集</span>'+cfg().goals.map(g=>'<span>'+(g.fruit!=null?fsq(g.fruit):g.feature?featureIcon(g.feature):g.tool?toolIcon(g.tool):g.special==='bomb'?'手动 💥':'手动 🌈')+' ×'+g.n+'</span>').join('')+'<span>· '+cfg().moves+'步</span></div>' : '';
  const kicker=mode==='intro'?'第 '+(G.level+1)+' 关 · '+cfg().name:note||'看动画，跟着划';
  const controls='<div class="lesson-controls"><button data-act="lesson-replay">↻ 重播</button><button data-act="lesson-pause" aria-pressed="false">Ⅱ 暂停动画</button></div>';
  const actions=mode==='intro'
    ? '<button class="btn" data-act="home">返回</button><button class="btn primary" data-act="go">开始采摘</button>'
    : notice ? '<button class="btn primary" data-act="wxok">'+(mode==='weather-before'?'明白了，准备迎接':'知道了，继续')+'</button>'
    : returnTo==='play' ? '<button class="btn primary" data-act="lesson-close">继续采摘</button>'
    : '<button class="btn" data-act="lesson-close">'+(returnTo==='menu'?'返回':'继续游戏')+'</button><button class="btn primary" data-act="lesson-try">'+(returnTo==='menu'?'去试试':'继续采摘')+'</button>';
  overlay.innerHTML='<div class="panel lesson-panel" role="dialog" aria-modal="true" aria-label="动画玩法讲解">'+
    '<div class="kicker">'+kicker+'</div>'+
    (mode==='intro'||notice?'':'<nav class="lesson-groups" aria-label="选择讲解分类">'+groups+'</nav><nav class="lesson-topics" aria-label="选择动画">'+topicButtons+'</nav>')+
    '<h2>'+l.title+'</h2><p class="lesson-copy">'+copy+'</p>'+goals+guide.render(id,FRUITS,{bee:cfg().orchard?.bee})+controls+
    (mode==='intro'||notice?'':'<button class="lesson-next" data-act="lesson-topic" data-topic="'+next+'">下一个：'+guide.lessons[next].label+' →</button>')+
    '<div class="btns">'+actions+'</div></div>';
  showOverlay();
  const svg=overlay.querySelector('svg');
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches&&svg&&svg.pauseAnimations)svg.pauseAnimations();
}
function closeLesson(tryNow=false){
  rememberWeatherLesson();
  if(lessonView.returnTo==='menu'){
    if(tryNow)startLevel(recommendedLevel());else showMenu();
  }else {const teachNext=lessonView.mode==='feature-intro';G.state='play';hideOverlay();if(teachNext)teachOrchard();}
}
function toggleLessonAnimation(button){
  const panel=overlay.querySelector('.lesson-panel'),svg=overlay.querySelector('svg');
  if(!panel)return;
  const paused=button.getAttribute('aria-pressed')!=='true';
  panel.classList.toggle('lesson-paused',paused);
  button.setAttribute('aria-pressed',String(paused));
  button.textContent=paused?'▶ 继续动画':'Ⅱ 暂停动画';
  if(svg){if(paused&&svg.pauseAnimations)svg.pauseAnimations();else if(svg.unpauseAnimations)svg.unpauseAnimations();}
}

overlay.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(act === 'start'){const i=Number(btn.dataset.lv);if(isLevelOpen(i)){const r=readSavedRun();if(r&&r.level===i)resumeRun();else startLevel(i);}}
  else if(act==='unlock-all')unlockAllLevels();
  else if(act === 'go') startLevel(G.level);
  else if(act === 'retry') startLevel(G.level);
  else if(act === 'next') startLevel(Math.min(LEVEL_N - 1, G.level + 1));
  else if(act === 'home') showMenu();
  else if(act==='home-start')homeStart();
  else if(act==='continue-run'){if(!resumeRun())showLevelSelect();}
  else if(act==='credits')showCredits();
  else if(act==='levels')showLevelSelect();
  else if(act === 'resume'){ G.state = 'play'; hideOverlay(); }
  else if(act === 'wxok'){G.path=[];closeLesson();}
  else if(act === 'wxclose'){ G.state = 'play'; G.path = []; hideOverlay(); }
  else if(act === 'help') showHelp();
  else if(act === 'lesson-topic') showLesson(btn.dataset.topic);
  else if(act === 'lesson-group'){
    const first=Object.keys(window.FruitGuide.lessons).find(k=>window.FruitGuide.lessons[k].group===btn.dataset.group);
    if(first)showLesson(first);
  }
  else if(act === 'lesson-replay') showLesson(lessonView.id);
  else if(act === 'lesson-pause') toggleLessonAnimation(btn);
  else if(act === 'lesson-close') closeLesson();
  else if(act === 'lesson-try') closeLesson(true);
  else if(act === 'helpclose'){ if(helpReturnState==='menu') showMenu(); else {G.state='play';hideOverlay();} }
});

btnHelp.addEventListener('click',showHelp);

btnWeatherClass.addEventListener('click',showWeatherClass);

});

/* =========================================================
   18. 输入
   ========================================================= */
let activePointer = null, lastPointerPoint = null;
function clearGesture(){
  G.path = [];
  if(activePointer !== null && cv.hasPointerCapture && cv.hasPointerCapture(activePointer)) cv.releasePointerCapture(activePointer);
  activePointer = null;
  lastPointerPoint = null;
}
function toLocal(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
function tracePointer(p){
  if(!lastPointerPoint){ lastPointerPoint=p; return; }
  const first=G.path[0];
  const nearStart=q=>first&&Math.hypot(q.x-colX(first.c),q.y-rowY(first.r))<=TILE*.55+2;
  // The drawn ring extends beyond the cell. Touching it closes a valid loop.
  // Keep that closure on pointerup, even if the finger remains just outside the cell.
  if(nearStart(p)&&(canCloseLoop(G.path)||pathIsLoop(G.path))){
    if(!pathIsLoop(G.path))extendPath(first);
    lastPointerPoint=p;return;
  }
  const from=lastPointerPoint;
  const steps=Math.max(1,Math.ceil(Math.hypot(p.x-from.x,p.y-from.y)/(TILE*0.18)));
  for(let i=1;i<=steps;i++){
    const sample={x:from.x+(p.x-from.x)*i/steps,y:from.y+(p.y-from.y)*i/steps};
    if(nearStart(sample)&&canCloseLoop(G.path)){extendPath(first);break;}
    const cell=cellFromPoint(sample.x,sample.y);
    if(cell) extendPath(cell);
  }
  lastPointerPoint=p;
}
cv.addEventListener('pointerdown', (e) => {
  if(activePointer !== null || e.isPrimary === false || (e.button !== undefined && e.button !== 0)) return;
  e.preventDefault();
  const p = toLocal(e);
  if(G.state !== 'play' || G.phase !== 'idle') return;
  const cell = cellFromPoint(p.x, p.y);
  if(G.activeTool){if(cell)usePocketTool(cell);return;}
  if(!cell || !G.grid[cell.r][cell.c]) return;
  G.hintT = 0; G.hint = null;
  const t = G.grid[cell.r][cell.c];
  if(t.frost){
    G.shake = Math.max(G.shake, 0.16);
    floatText(colX(cell.c), rowY(cell.r) - TILE * 0.5, '❄️ 划不动', '#6fa8dc', 13);
    blip(190, 0.08, 'square', 0.03);
    return;
  }
  activePointer = e.pointerId;
  lastPointerPoint = p;
  if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  G.path = [cell];
  sfxSelect();
});
cv.addEventListener('pointermove', (e) => {
  if(e.pointerId !== activePointer || G.state !== 'play' || G.phase !== 'idle' || !G.path.length) return;
  const samples = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for(const sample of samples) tracePointer(toLocal(sample));
  tracePointer(toLocal(e));
});
window.addEventListener('pointerup', (e) => {
  if(e.pointerId !== activePointer) return;
  if(G.state === 'play' && G.phase === 'idle'){
    tracePointer(toLocal(e));
    commitPath();
  }
  clearGesture();
});
window.addEventListener('pointercancel', (e) => { if(e.pointerId === activePointer) clearGesture(); });
cv.addEventListener('lostpointercapture', (e) => { if(e.pointerId === activePointer) clearGesture(); });
window.addEventListener('blur',clearGesture);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   19. 主循环与启动
   ========================================================= */
let last = 0;
function loop(ts){
  if(!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if(dt > 0.05) dt = 0.05;
  nowMs = ts;
  try{
    update(dt);
    draw();
  }catch(e){
    /* 单帧异常不应杀死主循环 */
    if(!loop._err){ loop._err = 1; console.error(e); }
  }
  requestAnimationFrame(loop);
}

resize();
btnSound.textContent = audioOn ? '🔊' : '🔇';
G.level = 0;
applyThemeVars();

const QP = new URLSearchParams(location.search);
const AUTO = parseInt(QP.get('auto'), 10);
if(AUTO >= 1 && AUTO <= LEVEL_N) startLevel(AUTO - 1);
else showMenu();
requestAnimationFrame(loop);

/* 调试/自动化入口 */
window.__api = {
  startLevel, update, draw, nextCascadeStep, finishPath, activateRainbow, triggerWeather, maybeWeather, rowShiftMatch,
  findMatches, findHint, hasAnyMove, announceWeather, showWxCodex, scoreChipLayout, prog,
  extendPath, pathIsLoop, canCloseLoop, pathPreview, pathLength, chainPraise, commitPath, tracePointer, clearGesture, updatePlayHUD,
  showHelp, showIntro, showLesson, closeLesson,
  G, LEVELS, cfg, selectPocketTool, usePocketTool, cancelTool, saveRun, readSavedRun, resumeRun, clearSavedRun, homeStart, showMenu, showLevelSelect, unlockAllLevels, isLevelOpen, showCredits, sfxBomb, processMatchGroups, ensureWeatherPlan, buildWeatherPlan,
  setTile(r, c, type, special){ G.grid[r][c] = makeTile(type, r, c, special); },
  forceWin(){
    for(const o of G.orders){
      if(o.kind === 'fruit') o.got = o.n;
      else if(o.kind==='feature'){if(o.feature==='flowers'){G.orchard.flowers=[];G.orchard.gathered=cfg().orchard.flowers.length;}else G.orchard[o.feature]=o.n;}
      else if(o.kind==='tool'){G.toolUses[o.tool]=o.n;G.tools[o.tool]=toolAllowance(cfg())[o.tool]-o.n;}
      else if(o.special === 'bomb') G.stats.bombMade = o.n;
      else G.stats.rainbowMade = o.n;
    }
    updateOrders();
  },
};

})();
