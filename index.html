let initialLevel=Array.from({length:total},(_,i)=>i).find(i=>!passed.includes(i))??0;
try{const raw=localStorage.getItem('knit-last-level'),saved=Number(raw);if(raw!==null&&Number.isInteger(saved)&&saved>=0&&saved<total)initialLevel=saved;}catch{}
syncSound();load(initialLevel);
KnitPages.init({getProgress:()=>({passed:passed.slice(),lastLevel:level}),onViewChange:view=>{$('#back-home').hidden=view==='home';},onPlay:i=>{if(locked()||!Number.isInteger(i)||i<0||i>=total)return;const resume=i===level&&history.length>0&&!E.won(state);KnitPages.game();if(resume){render();showCoach();}else load(i);if(!KnitCoach.isOpen())$('#game-screen').focus({preventScroll:true});}});
booting=false;

</script></body></html>
